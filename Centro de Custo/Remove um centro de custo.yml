info:
  name: Remove um centro de custo
  type: http
  seq: 4
  tags:
    - Centro de Custo

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/centrocustos"
  body:
    type: json
    data: |-
      {
        "empresa_id": 900001,
        "centro_custo_id": 42
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Exclusão realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro apagado com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 409 Response
    description: "Centro de custo em uso: exclusão bloqueada por dependências"
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 409,
            "mensagem": "Ocorreu um conflito de dados.",
            "erros": {
              "dados.0.campo": [
                "Ocorreu um conflito de dados em dados.0.campo."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 500,
            "mensagem": "Ocorreu um erro interno no servidor."
          }

docs: "Remove um centro de custo do sistema. Operação idempotente: retorna Status Code 200(OK) mesmo quando o registro não existe. É validado se o centro de custo está em uso antes de excluir, caso esteja em uso, retornará erro e não será removido. ATENÇÃO: Essa ação não poderá ser desfeita. O centro de custo só pode ser removido se não estiver em uso."
