info:
  name: Lista centros de custo paginados
  type: http
  seq: 1
  tags:
    - Centro de Custo

http:
  method: GET
  url: "{{baseUrl}}/api/v1/centrocustos"
  params:
    - name: empresa_id
      value: "12345"
      type: query
      description: ID da empresa vinculada ao usuário
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: centro_custo_id
      value: "42"
      type: query
      description: Filtra pelo ID exato do centro de custo
    - name: alterado_data
      value: 2026-01-01 00:00:00
      type: query
      description: Filtra registros com logAlteradoData >= data informada
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista paginada de centros de custo
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: centro_custo_id
          value: "42"
          type: query
          description: Filtra pelo ID exato do centro de custo
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= data informada
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "cliente_id": 1234,
                "empresa_id": 900001,
                "centro_custo_id": 42,
                "centro_custo": "001",
                "nome": "Administrativo",
                "log_cadastro_data": "2026-05-14 10:00:00",
                "log_alterado_data": "2026-05-14 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: centro_custo_id
          value: "42"
          type: query
          description: Filtra pelo ID exato do centro de custo
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= data informada
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: centro_custo_id
          value: "42"
          type: query
          description: Filtra pelo ID exato do centro de custo
