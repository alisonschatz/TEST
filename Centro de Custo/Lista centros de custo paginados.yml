    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: centro_custo_id
