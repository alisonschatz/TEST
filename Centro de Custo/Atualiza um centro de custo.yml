info:
  name: Atualiza um centro de custo
  type: http
  seq: 2
  tags:
    - Centro de Custo

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/centrocustos"
  body:
    type: json
    data: |-
      {
        "empresa_id": 900001,
        "centro_custo_id": 42,
        "centro_custo": "002",
        "nome": "Administrativo Atualizado"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Centro de custo atualizado com sucesso
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42,
            "centro_custo": "002",
            "nome": "Administrativo Atualizado"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": {
              "cliente_id": 1234,
              "empresa_id": 900001,
              "centro_custo_id": 42,
              "centro_custo": "001",
              "nome": "Administrativo",
              "log_cadastro_data": "2026-05-14 10:00:00",
              "log_alterado_data": "2026-05-14 12:00:00"
            }
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42,
            "centro_custo": "002",
            "nome": "Administrativo Atualizado"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42,
            "centro_custo": "002",
            "nome": "Administrativo Atualizado"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Registro não encontrado ou validação
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42,
            "centro_custo": "002",
            "nome": "Administrativo Atualizado"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/centrocustos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "centro_custo_id": 42,
            "centro_custo": "002",
            "nome": "Administrativo Atualizado"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 500,
            "mensagem": "Ocorreu um erro interno no servidor."
          }

docs: "Atualiza os campos de negócio de um centro de custo. As chaves empresa_id, centro_custo_id são imutáveis e usadas apenas para localizar o registro. ATENÇÃO: DEVE SER ENVIADO TODOS OS CAMPOS DO REGISTRO PARA ATUALIZAR O REGISTRO, OS VALORES ENVIADOS VAZIOS SERÃO LIMPOS."
