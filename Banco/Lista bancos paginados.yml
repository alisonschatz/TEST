info:
  name: Lista bancos paginados
  type: http
  seq: 1
  tags:
    - Banco
    - Agência

http:
  method: GET
  url: "{{baseUrl}}/api/v1/bancos?sistema_id=52"
  headers:
    - name: Authorization
      value: Bearer {{token_atual}}
  params:
    - name: sistema_id
      value: "52"
      type: query
      description: ID do sistema
    - name: page
      value: ""
      type: query
      description: Página atual
      disabled: true
    - name: banco_id
      value: ""
      type: query
      description: Filtra pelo ID exato do banco
      disabled: true
    - name: log_alterado_data
      value: ""
      type: query
      description: Filtra registros com log_alterado_data >= valor (sincronização incremental)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista paginada de bancos
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: GET
      params:
        - name: sistema_id
          value: "1"
          type: query
          description: ID do sistema
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: banco_id
          value: "1"
          type: query
          description: Filtra pelo ID exato do banco
        - name: log_alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com log_alterado_data >= valor (sincronização incremental)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "cliente_id": 1234,
                "banco_id": 1,
                "v_banco_id": 1,
                "codigo_febraban": 341,
                "descricao": "Itaú Unibanco",
                "sistema_id": 1,
                "log_cadastro_data": "2026-05-15 10:00:00",
                "log_alterado_data": "2026-05-15 10:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: GET
      params:
        - name: sistema_id
          value: "1"
          type: query
          description: ID do sistema
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: banco_id
          value: "1"
          type: query
          description: Filtra pelo ID exato do banco
        - name: log_alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com log_alterado_data >= valor (sincronização incremental)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: GET
      params:
        - name: sistema_id
          value: "1"
          type: query
          description: ID do sistema
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: banco_id
          value: "1"
          type: query
          description: Filtra pelo ID exato do banco
        - name: log_alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com log_alterado_data >= valor (sincronização incremental)
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: GET
      params:
        - name: sistema_id
          value: "1"
          type: query
          description: ID do sistema
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: banco_id
          value: "1"
          type: query
          description: Filtra pelo ID exato do banco
        - name: log_alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com log_alterado_data >= valor (sincronização incremental)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Retorna lista paginada de bancos. Filtros opcionais por banco_id e log_alterado_data. Acessível para todos os tipos de usuários e tokens.
