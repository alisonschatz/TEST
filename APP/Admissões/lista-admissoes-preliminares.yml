info:
  name: Lista Admissões Preliminares
  type: http
  seq: 5
  tags:
    - Admissões

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admissoes/preliminares?{{rt_query}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista retornada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/funcionario/preliminar"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: id
          value: "1"
          type: query
          description: Filtro por id da admissão preliminar
        - name: situacao
          value: nao_liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: integrado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: aguardando_integracao
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: recusado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: alterado_data
          value: 2025-01-01 00:00:00
          type: query
          description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "empresa_id": 900001,
                "v_id": 1001,
                "id": 1233141,
                "tipo_colaborador": 1,
                "tipo_admissao": null,
                "classe_id": 1,
                "nome": "João da Silva",
                "matricula_anterior": null,
                "nascimento_data": "1990-05-15",
                "admissao_data": "2025-09-24",
                "cpf": "123.456.789-00",
                "pis": "000.00000.00.0",
                "numero_recibo": null,
                "data_integracao": null,
                "preenchimento_dados_cadastrais": true,
                "email": "joao.silva@example.com",
                "matricula_esocial": null,
                "categoria_esocial_id": 101,
                "funcao_id": null,
                "tipo": null,
                "salario": 3500.75,
                "contrato_tipo_id": null,
                "prazo_experiencia": 90,
                "fim_prazo_experiencia": "2025-12-23",
                "funcionario_contribuinte_id": null,
                "log_cadastro_data": "2025-01-01 08:00:00",
                "log_alterado_data": "2025-06-01 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/funcionario/preliminar"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: id
          value: "1"
          type: query
          description: Filtro por id da admissão preliminar
        - name: situacao
          value: nao_liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: integrado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: aguardando_integracao
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: recusado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: alterado_data
          value: 2025-01-01 00:00:00
          type: query
          description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/funcionario/preliminar"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: id
          value: "1"
          type: query
          description: Filtro por id da admissão preliminar
        - name: situacao
          value: nao_liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: liberado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: integrado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: aguardando_integracao
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: situacao
          value: recusado
          type: query
          description: Filtro por situação de liberação (opcional)
          disabled: true
        - name: alterado_data
          value: 2025-01-01 00:00:00
          type: query
          description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }

docs: Retorna uma lista (opcionalmente paginada) de registros de admissão preliminar. Pode ser filtrada por empresa e/liberação.
