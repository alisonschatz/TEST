info:
  name: Remove Admissões Completas
  type: http
  seq: 4
  tags:
    - Admissões

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/admissoes/completas"
  body:
    type: json
    data: |-
      {
        "empresa_id": "{{empresa_id}}",
        "funcionario_contribuinte_id": "{{funcionario_contribuinte_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

