          disabled: true
        - name: situacao
          value: recusado
          type: query
          description: |-
            Filtrar por situação do cadastro do colaborador. Envie o identificador textual correspondente ao estado desejado. Valores aceitos (definidos em SituacaoLiberacaoEnum, verificar schema `SituacaoLiberacaoEnum`):
