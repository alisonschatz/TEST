             *  - `integrado` - Registro integrado com sucesso.
             *  - `liberado` - Registro liberado para integração.
             *  - `nao_liberado` - Registro não liberado para integração.
             *  - `aguardando_integracao` - Registro aguardando conclusão da integração.
             *  - `recusado` - Registro recusado na importação. É necessário corrigir antes de realizar nova liberação.
          disabled: true
        - name: situacao
          value: liberado
          type: query
