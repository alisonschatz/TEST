info:
  name: Lista Admissões Completas
  type: http
  seq: 1
  tags:
    - Admissões

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admissoes/completas?{{rt_query}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista retornada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/funcionario/completa"
      method: GET
