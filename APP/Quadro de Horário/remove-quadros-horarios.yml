info:
  name: remove-quadros-horarios
  type: http
  seq: 4
  tags:
    - Quadro de Horário

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/quadros-horarios"
  body:
    type: json
    data: |-
      {
        "empresa_id": "{{empresa_id}}",
        "quadro_id": "{{quadro_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Remove um quadro de horário. Retorna 422 se o quadro_id não existir. Os registros de funcionarioAlteracaoQuadroHorario vinculados são removidos em cascata pelo banco (FK ON DELETE CASCADE). Requer token de sistema.
