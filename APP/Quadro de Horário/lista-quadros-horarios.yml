info:
  name: lista-quadros-horarios
  type: http
  seq: 1
  tags:
    - Quadro de Horário

http:
  method: GET
  url: "{{baseUrl}}/api/v1/quadros-horarios?{{rt_query}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Retorna lista paginada de quadros de horário da empresa. Filtros opcionais por quadro_id e quadro_horario_id. Acessível a Contabilidade (tipo 1) e Empresa (tipo 2).
