info:
  name: cria-quadros-horarios
  type: http
  seq: 3
  tags:
    - Quadro de Horário

http:
  method: POST
  url: "{{baseUrl}}/api/v1/quadros-horarios"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": "{{empresa_id}}",
            "v_quadro_horario_id": "{{v_quadro_horario_id}}",
            "descricao": "{{descricao}}",
            "horario_flexivel": {{horario_flexivel}},
            "ativo": {{ativo}},
            "dom": {
              "entrada_1": "{{dom_entrada_1}}",
              "saida_1": "{{dom_saida_1}}",
              "entrada_2": "{{dom_entrada_2}}",
              "saida_2": "{{dom_saida_2}}",
              "entrada_3": "{{dom_entrada_3}}",
              "saida_3": "{{dom_saida_3}}",
              "entrada_4": "{{dom_entrada_4}}",
              "saida_4": "{{dom_saida_4}}"
            },
            "seg": {
              "entrada_1": "{{seg_entrada_1}}",
              "saida_1": "{{seg_saida_1}}",
              "entrada_2": "{{seg_entrada_2}}",
              "saida_2": "{{seg_saida_2}}",
              "entrada_3": "{{seg_entrada_3}}",
              "saida_3": "{{seg_saida_3}}",
              "entrada_4": "{{seg_entrada_4}}",
              "saida_4": "{{seg_saida_4}}"
            },
            "ter": {
              "entrada_1": "{{ter_entrada_1}}",
              "saida_1": "{{ter_saida_1}}",
              "entrada_2": "{{ter_entrada_2}}",
              "saida_2": "{{ter_saida_2}}",
              "entrada_3": "{{ter_entrada_3}}",
              "saida_3": "{{ter_saida_3}}",
              "entrada_4": "{{ter_entrada_4}}",
              "saida_4": "{{ter_saida_4}}"
            },
            "qua": {
              "entrada_1": "{{qua_entrada_1}}",
              "saida_1": "{{qua_saida_1}}",
              "entrada_2": "{{qua_entrada_2}}",
              "saida_2": "{{qua_saida_2}}",
              "entrada_3": "{{qua_entrada_3}}",
              "saida_3": "{{qua_saida_3}}",
              "entrada_4": "{{qua_entrada_4}}",
              "saida_4": "{{qua_saida_4}}"
            },
            "qui": {
              "entrada_1": "{{qui_entrada_1}}",
              "saida_1": "{{qui_saida_1}}",
              "entrada_2": "{{qui_entrada_2}}",
              "saida_2": "{{qui_saida_2}}",
              "entrada_3": "{{qui_entrada_3}}",
              "saida_3": "{{qui_saida_3}}",
              "entrada_4": "{{qui_entrada_4}}",
              "saida_4": "{{qui_saida_4}}"
            },
            "sex": {
              "entrada_1": "{{sex_entrada_1}}",
              "saida_1": "{{sex_saida_1}}",
              "entrada_2": "{{sex_entrada_2}}",
              "saida_2": "{{sex_saida_2}}",
              "entrada_3": "{{sex_entrada_3}}",
              "saida_3": "{{sex_saida_3}}",
              "entrada_4": "{{sex_entrada_4}}",
              "saida_4": "{{sex_saida_4}}"
            },
            "sab": {
              "entrada_1": "{{sab_entrada_1}}",
              "saida_1": "{{sab_saida_1}}",
              "entrada_2": "{{sab_entrada_2}}",
              "saida_2": "{{sab_saida_2}}",
              "entrada_3": "{{sab_entrada_3}}",
              "saida_3": "{{sab_saida_3}}",
              "entrada_4": "{{sab_entrada_4}}",
              "saida_4": "{{sab_saida_4}}"
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Permite cadastrar múltiplos quadros de horário de uma só vez. quadro_id não é informado (auto-incremento). ativo tem default 1. Requer token de sistema.
