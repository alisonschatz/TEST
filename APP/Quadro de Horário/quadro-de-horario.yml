          let debounceStatus = null;
          bru.ctx.onVariablesChange = () => {
            clearTimeout(debounceStatus);
            debounceStatus = setTimeout(() => app.atualizarEstadoDe(bru.ctx.variables.resolved), 350);
          };
        }
      }
    </script>
    </body>
    </html>