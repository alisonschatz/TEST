        finalizarTeste(det) { if (!this.ultimoTeste) return; if (det) this.ultimoTeste.detalhes = det; if (!this.ultimoTeste.steps.length) this.ultimoTeste.ok = false; }
        async rodarCicloVida() {
          if (!this.autenticado) { this.alert('Nenhum token selecionado (ou expirado). Escolha um no topo da tela — gere em Autenticação se precisar.'); return; }
          this.setLoading(this.els.btnCicloVida, true);
          this._travarAcoesTeste(true);
          this.iniciarTeste('CRUD', 'Ciclo de vida completo');
          const dados = this.gerarDadosQuadro('[TESTE-CICLO]');
          let quadroId = null;
          const buscarPorId = async () => {
            const res = await this.chamar(REQ.lista, { rt_query: `empresa_id=${dados.empresa_id}&quadro_id=${quadroId}` });
            const r = this.interpretar(res);
            if (!r.ok) return null;
            const lista = Array.isArray(r.body?.retorno) ? r.body.retorno : [];
            return lista.find(x => String(x.quadro_id) === String(quadroId)) || null;
          };
          try {
            const resC = await this.chamar(REQ.cria, dados);
            const rC = this.interpretar(resC);
            this.addStep('Criar registro', rC.ok, rC.ok ? `Status ${rC.status}` : rC.msg, dados, rC.body);
            if (!rC.ok) { this.finalizarTeste('Falhou na criação.'); this.setLoading(this.els.btnCicloVida, false); return; }
            const criado = Array.isArray(rC.body?.retorno) ? rC.body.retorno[0] : rC.body?.retorno;
            quadroId = criado?.quadro_id;
            if (!quadroId) { this.addStep('Verificar quadro_id', false, 'Resposta sem quadro_id.', null, rC.body); this.finalizarTeste('Criação não retornou quadro_id.'); this.setLoading(this.els.btnCicloVida, false); return; }
            this.addStep('Verificar quadro_id', true, `quadro_id = ${quadroId}`, null, null);
            if (criado) { this.testSessionIds.push({ quadro_id: criado.quadro_id, empresa_id: dados.empresa_id }); this._atualizarBtnLimparMassa(); }
    
            const enc1 = await buscarPorId();
            if (!enc1) { this.addStep('Buscar após criar', false, 'Não encontrado.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, null); this.finalizarTeste('Sumiu após criação.'); this.setLoading(this.els.btnCicloVida, false); return; }
            const d1 = this.compararCompleto(dados, enc1);
            if (d1.length) { this.addStep('Buscar após criar', false, `${d1.length} divergência(s):\n` + d1.map(x => `• ${x.campo}: enviado "${x.esperado}" → recebido "${x.recebido}"`).join('\n'), {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, enc1); this.finalizarTeste('Divergência após criação.'); this.setLoading(this.els.btnCicloVida, false); return; }
            this.addStep('Buscar após criar', true, 'Todos os campos bateram.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, enc1);
    
            const dadosAt = this.gerarDadosQuadro('[TESTE-CICLO-EDITADO]');
            dadosAt.quadro_id = String(quadroId); dadosAt.empresa_id = dados.empresa_id;
            const resA = await this.chamar(REQ.atualiza, dadosAt);
            const rA = this.interpretar(resA);
            this.addStep('Atualizar registro', rA.ok, rA.ok ? `Status ${rA.status}` : rA.msg, dadosAt, rA.body);
            if (!rA.ok) { this.finalizarTeste('Falhou na atualização.'); this.setLoading(this.els.btnCicloVida, false); return; }
    
            const enc2 = await buscarPorId();
            if (!enc2) { this.addStep('Buscar após editar', false, 'Não encontrado.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, null); this.finalizarTeste('Sumiu após edição.'); this.setLoading(this.els.btnCicloVida, false); return; }
            const d2 = this.compararCompleto(dadosAt, enc2);
            if (d2.length) { this.addStep('Buscar após editar', false, `${d2.length} divergência(s):\n` + d2.map(x => `• ${x.campo}: enviado "${x.esperado}" → recebido "${x.recebido}"`).join('\n'), {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, enc2); this.finalizarTeste('Divergência após edição.'); this.setLoading(this.els.btnCicloVida, false); return; }
            this.addStep('Buscar após editar', true, 'Todos os campos bateram.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, enc2);
    
            const resE = await this.chamar(REQ.remove, { empresa_id: String(dados.empresa_id), quadro_id: String(quadroId) });
            const rE = this.interpretar(resE);
            this.addStep('Excluir registro', rE.ok, rE.ok ? `Status ${rE.status}` : rE.msg, {empresa_id: dados.empresa_id, quadro_id: quadroId}, rE.body);
            if (!rE.ok) { this.finalizarTeste('Falhou na exclusão.'); this.setLoading(this.els.btnCicloVida, false); return; }
            this.testSessionIds = this.testSessionIds.filter(x => String(x.quadro_id) !== String(quadroId));
