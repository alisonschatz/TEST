            this._travarAcoesTeste(false);
          }
        }
        _formatarRelatorioTeste(t) {
          const linhas = [];
          linhas.push(`${t.ok ? 'SUCESSO' : 'FALHA'} — [${t.categoria}] ${t.acao}`);
          linhas.push(`Data: ${t.ts.toLocaleString('pt-BR')}`);
          if (t.detalhes) linhas.push(`Resumo: ${t.detalhes}`);
          linhas.push('');
          linhas.push('Passos:');
          t.steps.forEach((s, i) => {
            const status = s.ok ? 'OK' : (s.skipped ? 'SKIP' : 'FALHA');
            const hora = s.ts ? s.ts.toLocaleTimeString('pt-BR') : '';
            linhas.push('');
            linhas.push(`${i + 1}. [${status}] ${s.acao}${hora ? ` (${hora})` : ''}`);
            if (s.detalhes) {
              String(s.detalhes).split('\n').forEach(l => linhas.push(`   ${l}`));
            }
            if (s.requestJson) {
              linhas.push('   Request enviado:');
              JSON.stringify(s.requestJson, null, 2).split('\n').forEach(l => linhas.push(`   ${l}`));
            }
            if (s.responseJson) {
              linhas.push('   Response recebido:');
              JSON.stringify(s.responseJson, null, 2).split('\n').forEach(l => linhas.push(`   ${l}`));
            }
          });
          return linhas.join('\n');
        }
        async _copiarTexto(texto) {
          // 1) Clipboard API moderna (pode ser bloqueada dentro do iframe do widget)
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(texto);
              this.alert('Relatório copiado para a área de transferência.', 'ok');
              return;
            }
          } catch (e) { /* segue para o fallback */ }
          // 2) Fallback via execCommand (funciona em mais contextos restritos)
          try {
            const temp = document.createElement('textarea');
            temp.value = texto;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.focus();
            temp.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(temp);
            if (ok) { this.alert('Relatório copiado para a área de transferência.', 'ok'); return; }
          } catch (e) { /* segue para o último recurso */ }
          // 3) Último recurso: mostra o texto pronto para o usuário copiar manualmente (Ctrl+C)
          this._mostrarTextoParaCopiar(texto);
        }
        _mostrarTextoParaCopiar(texto) {
          const overlay = this.els.textoCopiaOverlay;
          const area = this.els.textoCopiaArea;
          if (!overlay || !area) { this.alert('Não foi possível copiar automaticamente.'); return; }
          area.value = texto;
          overlay.classList.add('active');
          setTimeout(() => { area.focus(); area.select(); }, 50);
        }
        copiarTeste() {
          if (!this.ultimoTeste) { this.alert('Nenhum teste executado.'); return; }
