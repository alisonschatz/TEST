          if (this.testSessionIds.length === 0) { this.iniciarTeste('Limpeza', 'Limpar dados de teste'); this.addStep('Verificar', true, 'Nenhum registro rastreado.', null, null); this.finalizarTeste('Nenhum registro rastreado.'); return; }
          const conf = await this.confirmar(`Excluir ${this.testSessionIds.length} registro(s) de teste? Essa ação não pode ser desfeita.`);
          if (!conf) return;
          this.massando = true;
          this._travarAcoesTeste(true);
          try {
            const pendentes = [...this.testSessionIds];
            this.iniciarTeste('Limpeza', 'Limpar dados de teste');
            let ok = 0, fail = 0;
            this.els.massaProgresso.innerHTML = '<span class="spinner spinner-dark"></span> Iniciando limpeza...';
            this.els.massaProgresso.classList.add('ativo');
            for (const item of pendentes) {
              this.els.massaProgresso.innerHTML = `<span class="spinner spinner-dark"></span> Excluindo ${ok+fail+1} de ${pendentes.length}... (${ok} ok, ${fail} falha)`;
              const req = { empresa_id: item.empresa_id, quadro_id: item.quadro_id };
              try {
                const res = await this.chamar(REQ.remove, req);
                const r = this.interpretar(res);
                this.addStep(`Excluir ${item.quadro_id}`, r.ok, r.ok ? `Status ${r.status}` : r.msg, req, r.body);
                if (r.ok) { ok++; this.testSessionIds = this.testSessionIds.filter(x => String(x.quadro_id) !== String(item.quadro_id)); this._atualizarBtnLimparMassa(); }
                else fail++;
              } catch (err) { fail++; this.addStep(`Excluir ${item.quadro_id}`, false, err.message || String(err), req, null); }
              await esperar(150);
            }
            this.els.massaProgresso.innerHTML = `Limpeza concluída: ${ok} excluído(s), ${fail} falha(s).`;
            this.els.massaProgresso.classList.remove('ativo');
            this._atualizarBtnLimparMassa();
            this.finalizarTeste(`${ok} excluído(s), ${fail} falha(s).`);
            this.buscar(false);
          } finally {
