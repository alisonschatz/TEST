            const enc3 = await buscarPorId();
            if (enc3) { this.addStep('Confirmar exclusão', false, 'Ainda aparece na busca.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, enc3); this.finalizarTeste('Persistiu após exclusão.'); this.setLoading(this.els.btnCicloVida, false); return; }
            this.addStep('Confirmar exclusão', true, 'Registro não encontrado após exclusão.', {rt_query:`empresa_id=${dados.empresa_id}&quadro_id=${quadroId}`}, null);
    
            this.finalizarTeste(`Ciclo completo: criado (${quadroId}) → buscado → editado → buscado → excluído → confirmado. Todos os campos bateram.`);
          } catch (err) {
            this.addStep('Erro inesperado', false, err.message || String(err), null, null);
            this.finalizarTeste('Erro inesperado durante o teste.');
          } finally {
            this.setLoading(this.els.btnCicloVida, false);
            this._travarAcoesTeste(false);
          }
        }
        _atualizarBtnLimparMassa() {
          const btn = this.els.btnLimparMassa;
          if (!btn) return;
          const n = this.testSessionIds.length;
          btn.textContent = n > 0 ? `Limpar ${n} registro${n === 1 ? '' : 's'} desta sessão` : 'Limpar dados desta sessão';
        }
        _travarAcoesTeste(travado) {
          // Garante exclusão mútua: enquanto qualquer uma das 3 ações de teste está
