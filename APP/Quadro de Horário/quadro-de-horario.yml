        }
        // -------------------- TESTE DE PERMISSÃO --------------------
        // Prepara um registro com o token ATIVO (para garantir que exista algo a atualizar/excluir)
        // e então tenta as 3 operações de escrita usando o token de PARCEIRO — o esperado é 401/403
        // nas três. Não deixa nada para trás: limpa o registro auxiliar com o token selecionado ao final.
        async rodarTestePermissao() {
          if (!this.autenticado) { this.alert('Nenhum token selecionado (ou expirado). Escolha um no topo da tela.'); return; }
          let tokenParceiro = null;
          try { tokenParceiro = bru.ctx.variables.resolved['slot_parceiro_token']; } catch (e) {}
          if (!tokenParceiro) { this.alert('Nenhum token no slot "Sistema Parceiro". Gere um em Autenticação antes de rodar este teste.'); return; }

          this.setLoading(this.els.btnTestePermissao, true);
          this._travarAcoesTeste(true);
          this.iniciarTeste('Permissão', 'Token Parceiro deve ser bloqueado em escrita');
          let dadosBase = null;
          let quadroTesteId = null;
          try {
            dadosBase = this.gerarDadosQuadro('[TESTE-PERMISSAO]');
            const resBase = await this.chamar(REQ.cria, dadosBase);
            const rBase = this.interpretar(resBase);
            if (!rBase.ok) {
              this.addStep('Preparar registro auxiliar (token selecionado)', false, 'Não foi possível criar o registro auxiliar com o token selecionado — confira se ele tem permissão de escrita.\n' + rBase.msg, dadosBase, rBase.body);
              this.finalizarTeste('Abortado: sem permissão de escrita no perfil ativo para preparar o teste.');
              return;
            }
            const criado = Array.isArray(rBase.body?.retorno) ? rBase.body.retorno[0] : rBase.body?.retorno;
            quadroTesteId = criado?.quadro_id;
            this.addStep('Preparar registro auxiliar (token selecionado)', true, `Registro quadro_id=${quadroTesteId} criado, servirá de alvo dos testes abaixo.`, dadosBase, rBase.body);
            if (criado) { this.testSessionIds.push({ quadro_id: criado.quadro_id, empresa_id: dadosBase.empresa_id }); this._atualizarBtnLimparMassa(); }

            const dadosCria = this.gerarDadosQuadro('[TESTE-PERMISSAO-CRIA]');
            const resCria = await this.chamarComToken(REQ.cria, dadosCria, tokenParceiro);
            const rCria = this.interpretar(resCria);
            const bloqueadoCria = [401, 403].includes(rCria.status);
            this.addStep('POST com token Parceiro', bloqueadoCria, bloqueadoCria ? `Bloqueado corretamente (status ${rCria.status}).` : `FALHA DE SEGURANÇA: token Parceiro conseguiu criar (status ${rCria.status}).`, dadosCria, rCria.body);
            if (!bloqueadoCria) {
              const criadoIndevido = Array.isArray(rCria.body?.retorno) ? rCria.body.retorno[0] : rCria.body?.retorno;
              if (criadoIndevido?.quadro_id) await this.chamar(REQ.remove, { empresa_id: String(dadosCria.empresa_id), quadro_id: String(criadoIndevido.quadro_id) });
            }

            const dadosAt = { ...dadosBase, quadro_id: String(quadroTesteId), descricao: '[TESTE-PERMISSAO-DEVERIA-FALHAR]' };
            const resAt = await this.chamarComToken(REQ.atualiza, dadosAt, tokenParceiro);
            const rAt = this.interpretar(resAt);
            const bloqueadoAt = [401, 403].includes(rAt.status);
            this.addStep('PUT com token Parceiro', bloqueadoAt, bloqueadoAt ? `Bloqueado corretamente (status ${rAt.status}).` : `FALHA DE SEGURANÇA: token Parceiro conseguiu atualizar (status ${rAt.status}).`, dadosAt, rAt.body);

            const resDel = await this.chamarComToken(REQ.remove, { empresa_id: String(dadosBase.empresa_id), quadro_id: String(quadroTesteId) }, tokenParceiro);
            const rDel = this.interpretar(resDel);
            const bloqueadoDel = [401, 403].includes(rDel.status);
            this.addStep('DELETE com token Parceiro', bloqueadoDel, bloqueadoDel ? `Bloqueado corretamente (status ${rDel.status}).` : `FALHA DE SEGURANÇA: token Parceiro conseguiu excluir (status ${rDel.status}).`, { empresa_id: dadosBase.empresa_id, quadro_id: quadroTesteId }, rDel.body);

            const tudoBloqueado = bloqueadoCria && bloqueadoAt && bloqueadoDel;
            this.finalizarTeste(tudoBloqueado ? 'Permissões corretas: o token Parceiro foi bloqueado em todas as operações de escrita.' : 'ATENÇÃO: o token Parceiro conseguiu executar pelo menos uma operação de escrita — revisar permissões na API.');
          } catch (err) {
            this.addStep('Erro inesperado', false, err.message || String(err), null, null);
            this.finalizarTeste('Erro inesperado durante o teste de permissão.');
          } finally {
            if (quadroTesteId) {
              try {
                await this.chamar(REQ.remove, { empresa_id: String(dadosBase?.empresa_id || this.els.fEmpresaId.value), quadro_id: String(quadroTesteId) });
                this.testSessionIds = this.testSessionIds.filter(x => String(x.quadro_id) !== String(quadroTesteId));
                this._atualizarBtnLimparMassa();
              } catch (e) {}
            }
            this.setLoading(this.els.btnTestePermissao, false);
            this._travarAcoesTeste(false);
          }
        }
        // Chamado por Alpine (x-init="init()") assim que o elemento é processado —
