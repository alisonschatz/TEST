          this._acoesTravadas = travado;
          this._sincronizarBotoesAcao();
        }
        async criarMassa() {
          if (!this.autenticado) { this.alert('Nenhum token selecionado (ou expirado). Escolha um no topo da tela — gere em Autenticação se precisar.'); return; }
          const n = Math.max(1, Math.min(200, parseInt(this.els.massaQtd.value || '10', 10)));
          const prefixo = `[TESTE-MASSA-${Date.now()}]`;
          this.massando = true;
          this._travarAcoesTeste(true);
          if (this.els.spinnerMassa) this.els.spinnerMassa.classList.remove('hidden');
          try {
            this.iniciarTeste('Massa', `Criação em massa (${n} solicitados)`);
            this.els.massaProgresso.innerHTML = '<span class="spinner spinner-dark"></span> Iniciando...';
            this.els.massaProgresso.classList.add('ativo');
            let ok = 0, fail = 0;
            for (let i = 0; i < n; i++) {
              this.els.massaProgresso.innerHTML = `<span class="spinner spinner-dark"></span> Criando ${i+1} de ${n}... (${ok} ok, ${fail} falha)`;
              const d = this.gerarDadosQuadro(prefixo);
              try {
                const res = await this.chamar(REQ.cria, d);
                const r = this.interpretar(res);
                this.addStep(`Criar #${i+1}`, r.ok, r.ok ? `Status ${r.status}` : r.msg, d, r.body);
                if (r.ok) { const c = Array.isArray(r.body?.retorno) ? r.body.retorno[0] : r.body?.retorno; if (c?.quadro_id) this.testSessionIds.push({quadro_id: c.quadro_id, empresa_id: d.empresa_id}); ok++; this._atualizarBtnLimparMassa(); }
                else fail++;
              } catch (err) { fail++; this.addStep(`Criar #${i+1}`, false, err.message || String(err), d, null); }
              await esperar(200);
            }
