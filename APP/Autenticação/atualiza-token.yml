info:
  name: atualiza-token
  type: http
  seq: 3
  tags:
    - Autenticação

http:
  method: POST
  url: "{{authUrl}}/api/v1/auth/refresh"
  auth:
    type: bearer
    token: "{{token_app}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Registro "best-effort" no ambiente de verdade (útil fora do app). O app
        // Autenticação grava o resultado do refresh direto no slot correspondente via
        // bru.ctx.variables.runtime — não depende deste script para isso.
        if (res.getStatus() === 201) {
          const token = res.getBody()?.token;
          const validade = res.getBody()?.validade;
          if (token) {
            const expiraEm = validade ? new Date(Date.now() + validade * 1000).toISOString() : '';
            bru.setEnvVar('token_app', token, { persist: true });
            bru.setEnvVar('token_app_expira_em', expiraEm, { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Token refresh feito com sucesso
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "token": "",
            "validade": 0
          }
  - name: 400 Response
    description: A solicitação não atendeu o(s) seguinte(s) requisito(s)
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "erro": {},
            "payload": {}
          }
  - name: 401 Response
    description: Token refresh falhou.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": ""
          }

docs: |-
  Endpoint responsável por fazer a renovação de um JWT já existente.

  Uso recomendado: acionado pelo botão "Atualizar" de cada slot no app **Autenticação**, que passa
  o token daquele slot especificamente (via override de `token_app` só para esta chamada) — não há
  mais um único "token ativo" global, cada um dos até 3 slots (SCI, Parceiro, Personalizado) é
  renovado independentemente.