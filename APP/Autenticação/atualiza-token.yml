info:
  name: atualiza-token
  type: http
  seq: 2
  tags:
    - Autenticação

http:
  method: POST
  url: "{{authUrl}}/api/v1/auth/refresh"
  auth:
    type: bearer
    token: "{{token_app}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Substitui token_app pelo JWT renovado.
        if (res.getStatus() === 201) {
          const token = res.getBody()?.token;
          if (token) {
            bru.setEnvVar('token_app', token);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Token refresh feito com sucesso
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "token": "",
            "validade": 0
          }
  - name: 400 Response
    description: A solicitação não atendeu o(s) seguinte(s) requisito(s)
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "erro": {},
            "payload": {}
          }
  - name: 401 Response
    description: Token refresh falhou.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": ""
          }

docs: Endpoint responsável por fazer a renovação de um JWT já existente.