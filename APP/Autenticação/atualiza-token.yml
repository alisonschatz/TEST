info:
  name: atualiza-token
  type: http
  seq: 3
  tags:
    - Autenticação

http:
  method: POST
  url: "{{authUrl}}/api/v1/auth/refresh"
  auth:
    type: bearer
    token: "{{token_app}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Persiste de volta na variável do MESMO slot que foi renovado — quem chama
        // (o app Autenticação, via atualizarSlot) passa qual é o slot através da
        // runtime var "_slot_alvo". Sem isso não teríamos como saber em qual das duas
        // gavetas (SCI ou Parceiro) gravar o token renovado.
        if (res.getStatus() === 201) {
          const token = res.getBody()?.token;
          const validade = res.getBody()?.validade;
          const slot = bru.getVar('_slot_alvo'); // 'sci' | 'parceiro'
          if (token && (slot === 'sci' || slot === 'parceiro')) {
            const expiraEm = validade ? new Date(Date.now() + validade * 1000).toISOString() : '';
            bru.setEnvVar(`slot_${slot}_token`, token, { persist: true });
            bru.setEnvVar(`slot_${slot}_expira_em`, expiraEm, { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Token refresh feito com sucesso
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "token": "",
            "validade": 0
          }
  - name: 400 Response
    description: A solicitação não atendeu o(s) seguinte(s) requisito(s)
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": "",
            "erro": {},
            "payload": {}
          }
  - name: 401 Response
    description: Token refresh falhou.
    request:
      url: "{{baseUrl}}/api/v1/auth/refresh"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "mensagem": ""
          }

docs: |-
  Endpoint responsável por fazer a renovação de um JWT já existente.

  Uso recomendado: acionado pelo botão "Atualizar" de cada slot no app **Autenticação**, que passa
  o token daquele slot (via override de `token_app` só para esta chamada) e o nome do slot (via
  `_slot_alvo`) — o script `after-response` usa `_slot_alvo` para gravar o token renovado de volta
  em `slot_<slot>_token` / `slot_<slot>_expira_em`, as mesmas variáveis `secret: true` onde o token
  já estava. Cada um dos 2 slots (SCI, Parceiro) é renovado de forma independente.