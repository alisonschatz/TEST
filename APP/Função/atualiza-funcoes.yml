info:
  name: atualiza-funcoes
  type: http
  seq: 2
  tags:
    - Função

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/funcoes"
  body:
    type: json
    data: |-
      {
        "empresa_id": "{{empresa_id}}",
        "funcao_id": "{{funcao_id}}",
        "funcao": "{{funcao}}",
        "cbo_id": "{{cbo_id}}",
        "cbo": "{{cbo}}",
        "novo_esocial": {{novo_esocial}},
        "ativo": {{ativo}}
      }
  auth: inherit

vars:
  pre-request:
    - name: empresa_id
      value: "900001"
    - name: funcao_id
      value: "7"
    - name: funcao
      value: "Analista de Folha Sênior"
    - name: cbo_id
      value: "252305"
    - name: cbo
      value: "Analista de remuneração"
    - name: novo_esocial
      value: "1"
    - name: ativo
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Função atualizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha Sênior",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": {
              "cliente_id": 1234,
              "empresa_id": 900001,
              "funcao_id": 7,
              "funcao": "Analista de Folha",
              "cbo_id": "252305",
              "cbo": "Analista de remuneração",
              "novo_esocial": 1,
              "ativo": true,
              "log_cadastro_data": "2026-05-15 10:00:00",
              "log_alterado_data": "2026-05-15 10:00:00"
            }
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha Sênior",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha Sênior",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Registro não encontrado ou validação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha Sênior",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha Sênior",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Atualiza os campos de negócio de uma função. As chaves (empresa_id, funcao_id + cliente_id do token) são imutáveis e usadas apenas para localizar o registro.
