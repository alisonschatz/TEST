info:
  name: atualiza-funcoes
  type: http
  seq: 2
  tags:
    - Função

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/funcoes"
  body:
    type: json
    data: |-
      {
        "empresa_id": "{{empresa_id}}",
        "funcao_id": "{{funcao_id}}",
        "funcao": "{{funcao}}",
        "cbo_id": "{{cbo_id}}",
        "cbo": "{{cbo}}",
        "novo_esocial": {{novo_esocial}},
        "ativo": {{ativo}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Atualiza os campos de negócio de uma função. As chaves (empresa_id, funcao_id + cliente_id do token) são imutáveis e usadas apenas para localizar o registro.
