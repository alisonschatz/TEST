info:
  name: remove-funcoes
  type: http
  seq: 4
  tags:
    - Função

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/funcoes"
  body:
    type: json
    data: |-
      {
        "empresa_id": "{{empresa_id}}",
        "funcao_id": "{{funcao_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Remove uma função do sistema. Operação idempotente — retorna 200 mesmo quando o registro não existe. Valida se a função está em uso antes de excluir.
