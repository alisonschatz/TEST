info:
  name: cria-funcoes
  type: http
  seq: 3
  tags:
    - Função

http:
  method: POST
  url: "{{baseUrl}}/api/v1/funcoes"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": "{{empresa_id}}",
            "funcao_id": "{{funcao_id}}",
            "funcao": "{{funcao}}",
            "cbo_id": "{{cbo_id}}",
            "cbo": "{{cbo}}",
            "novo_esocial": {{novo_esocial}},
            "ativo": {{ativo}}
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Permite cadastrar múltiplas funções de uma só vez através de um array de dados. Cada item deve conter empresa_id, funcao_id e os campos obrigatórios.
