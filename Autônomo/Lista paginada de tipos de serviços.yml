info:
  name: Lista paginada de tipos de serviços
  type: http
  seq: 9
  tags:
    - Autônomo

http:
  method: GET
  url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
  params:
    - name: empresa_id
      value: "12345"
      type: query
      description: ID da empresa vinculada ao usuário
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: alterado_data
      value: 2025-01-01 00:00:00
      type: query
      description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Resposta com lista paginada de tipos de serviço
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2025-01-01 00:00:00
          type: query
          description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "tipo_servico_autonomo_id": 999999,
                "cliente_id": 86237,
                "empresa_id": 900001,
                "cbo": "9999-99",
                "descricao_cbo": "Teste CBO",
                "categoria_esocial": 101,
                "ativo": true,
                "log_cadastro_data": "2025-01-01 08:00:00",
                "log_alterado_data": "2025-06-01 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2025-01-01 00:00:00
          type: query
          description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Retorna uma lista de tipos de serviço disponíveis, utilizados para classificar os serviços prestados pelos autônomos. Pode incluir informações como nome, descrição e status ativo/inativo.
