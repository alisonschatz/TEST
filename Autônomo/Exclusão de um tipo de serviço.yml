info:
  name: Exclusão de um tipo de serviço
  type: http
  seq: 12
  tags:
    - Autônomo

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
  body:
    type: json
    data: |-
      {
        "tipo_servico_autonomo_id": 41,
        "empresa_id": 900001
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Exclusão realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "tipo_servico_autonomo_id": 41,
            "empresa_id": 900001
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro apagado com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "tipo_servico_autonomo_id": 41,
            "empresa_id": 900001
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "tipo_servico_autonomo_id": 41,
            "empresa_id": 900001
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Remove um tipo de serviço com base no seu ID. Essa ação é irreversível, a exclusão deve ser feita com atenção, considerando se há serviços ou autônomos vinculados ao tipo de serviço.
