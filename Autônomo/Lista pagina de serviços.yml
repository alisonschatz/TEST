info:
  name: Lista pagina de serviços
  type: http
  seq: 5
  tags:
    - Autônomo

http:
  method: GET
  url: "{{baseUrl}}/api/v1/autonomo/servicos"
  params:
    - name: empresa_id
      value: "12345"
      type: query
      description: ID da empresa vinculada ao usuário
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: per_page
      value: "15"
      type: query
      description: Registros por página
    - name: liberacao_id
      value: "1"
      type: query
      description: Filtro por liberação
    - name: alterado_data
      value: 2025-01-01 00:00:00
      type: query
      description: Retorna registros alterados a partir desta data/hora (YYYY-MM-DD / YYYY-MM-DD HH:MM:SS)
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

