info:
  name: Remove uma função
  type: http
  seq: 4
  tags:
    - Função

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/funcao"
  body:
    type: json
    data: |-
      {
        "empresa_id": 900001,
        "funcao_id": 7
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Exclusão realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro apagado com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Função em uso ou validação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "funcao_id": 7
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Remove uma função do sistema. Operação idempotente — retorna 200 mesmo quando o registro não existe. Valida se a função está em uso antes de excluir.
