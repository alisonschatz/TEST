info:
  name: Cadastra novas funções
  type: http
  seq: 3
  tags:
    - Função

http:
  method: POST
  url: "{{baseUrl}}/api/v1/funcao"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": 900001,
            "funcao_id": 7,
            "funcao": "Analista de Folha",
            "cbo_id": "252305",
            "cbo": "Analista de remuneração",
            "novo_esocial": 1,
            "ativo": true
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Funções cadastradas com sucesso
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true
              }
            ]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 201,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "cliente_id": 1234,
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true,
                "log_cadastro_data": "2026-05-15 10:00:00",
                "log_alterado_data": "2026-05-15 10:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true
              }
            ]
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcao_id": 7,
                "funcao": "Analista de Folha",
                "cbo_id": "252305",
                "cbo": "Analista de remuneração",
                "novo_esocial": 1,
                "ativo": true
              }
            ]
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Permite cadastrar múltiplas funções de uma só vez através de um array de dados. Cada item deve conter empresa_id, funcao_id e os campos obrigatórios.
