                "email": "agencia@email.com",
                "log_cadastro_data": "2026-05-14 10:00:00",
                "log_alterado_data": "2026-05-14 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/agencia"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: agencia_id
          value: "15"
          type: query
          description: Filtra pelo ID exato da agência
        - name: v_agencia_id
          value: "10"
          type: query
          description: Filtra pelo vID exato da agência
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
