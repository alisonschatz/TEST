info:
  name: Lista agências bancárias paginadas
  type: http
  seq: 1
  tags:
    - Agência

http:
  method: GET
  url: "{{baseUrl}}/api/v1/agencia?page=1"
  headers:
    - name: Authorization
      value: Bearer {{token_atual}}
  params:
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: agencia_id
      value: ""
      type: query
      description: Filtra pelo ID exato da agência
      disabled: true
    - name: v_agencia_id
      value: ""
      type: query
      description: Filtra pelo vID exato da agência
      disabled: true
    - name: alterado_data
      value: ""
      type: query
      description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista paginada de agências bancárias
    request:
      url: "{{baseUrl}}/api/v1/agencia"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: agencia_id
          value: "15"
          type: query
          description: Filtra pelo ID exato da agência
        - name: v_agencia_id
          value: "10"
          type: query
          description: Filtra pelo vID exato da agência
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "cliente_id": 1234,
                "v_agencia_id": 1,
                "banco_cadastro_id": 5,
                "nome_agencia": "Agência Central",
                "numero_agencia": "0001",
                "digito": "1",
                "endereco_cidade_id": 4200804,
                "endereco_cep": "88015-000",
                "endereco_logradouro_id": 1,
