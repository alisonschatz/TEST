info:
  name: Upload de documento
  type: http
  seq: 2
  tags:
    - Documento

http:
  method: POST
  url: "{{baseUrl}}/api/v1/documento/funcionario/:tipo_documento"
  params:
    - name: tipo_documento
      value: foto
      type: path
      description: Tipo de documento
    - name: tipo_documento
      value: cpf
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: rg
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: titulo_eleitor
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: pis
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: carteira_trabalho
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: cnh
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: comprovante_residencia
      type: path
      description: Tipo de documento
      disabled: true
  body:
    type: multipart-form
    data:
      - name: empresa_id
        type: text
        value: "12345"
        description: ID da empresa
      - name: funcionario_contribuinte_id
        type: text
        value: "98765"
        description: ID do funcionário contribuinte
      - name: arquivo
        type: file
        value: []
        description: Arquivo do documento (máx. 5MB, JPG/PNG/PDF)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

