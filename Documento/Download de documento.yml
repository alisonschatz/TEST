info:
  name: Download de documento
  type: http
  seq: 1
  tags:
    - Documento

http:
  method: GET
  url: "{{baseUrl}}/api/v1/documento/funcionario/:tipo_documento"
  params:
    - name: tipo_documento
      value: foto
      type: path
      description: Tipo de documento
    - name: tipo_documento
      value: cpf
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: rg
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: titulo_eleitor
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: pis
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: carteira_trabalho
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: cnh
      type: path
      description: Tipo de documento
      disabled: true
    - name: tipo_documento
      value: comprovante_residencia
      type: path
      description: Tipo de documento
      disabled: true
    - name: empresa_id
      value: "12345"
      type: query
      description: ID da empresa
    - name: funcionario_contribuinte_id
      value: "98765"
      type: query
      description: ID do funcionário contribuinte
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

