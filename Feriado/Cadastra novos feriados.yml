info:
  name: Cadastra novos feriados
  type: http
  seq: 3
  tags:
    - Feriado

http:
  method: POST
  url: "{{baseUrl}}/api/v1/feriados"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": 900001,
            "data": "2000-01-01",
            "descricao": "Teste Feriado",
            "log_cadastro_data": "2024-01-01 00:00:00",
            "log_alterado_data": "2024-06-01 00:00:00"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Operação realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/feriados"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "data": "2000-01-01",
                "descricao": "Teste Feriado",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "empresa_id": 900001,
                "data": "2000-01-01",
                "descricao": "Teste Feriado",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/feriados"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "data": "2000-01-01",
                "descricao": "Teste Feriado",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/feriados"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "data": "2000-01-01",
                "descricao": "Teste Feriado",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/feriados"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "data": "2000-01-01",
                "descricao": "Teste Feriado",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Permite cadastrar múltiplos feriados de uma só vez através de um array de dados. Cada item deve conter as informações obrigatórias descritas no schema. É útil para registrar calendários completos em um único envio.
