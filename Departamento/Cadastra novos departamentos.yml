info:
  name: Cadastra novos departamentos
  type: http
  seq: 3
  tags:
    - Departamento

http:
  method: POST
  url: "{{baseUrl}}/api/v1/departamentos"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": 900001,
            "cod_departamento": "RH-001",
            "departamento": "Recursos Humanos"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Departamentos criados com sucesso
    request:
      url: "{{baseUrl}}/api/v1/departamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "cliente_id": 1234,
                "empresa_id": 900001,
                "departamento_id": 7,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos",
                "log_cadastro_data": "2026-05-16 10:00:00",
                "log_alterado_data": "2026-05-16 10:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/departamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos"
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/departamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos"
              }
            ]
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/departamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos"
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/departamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cod_departamento": "RH-001",
                "departamento": "Recursos Humanos"
              }
            ]
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Permite cadastrar múltiplos departamentos de uma só vez através de um array de dados.
