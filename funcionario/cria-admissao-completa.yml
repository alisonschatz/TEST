          };

          // Salva o JSON estruturado dentro de "retorno", preservando o
          // envelope original (sucesso, status, mensagem)
          body.retorno = funcionarioAgrupado;
          res.setBody(body);

          // Guarda o ID gerado (auto-increment) numa variável do Bruno.
          // O PUT de atualização usa esse valor no pre-request, já que o
          // ID só existe depois que este POST cria o registro.
          if (funcionarioAgrupado.funcionario_contribuinte_id) {
            bru.setVar('funcionario_contribuinte_id', funcionarioAgrupado.funcionario_contribuinte_id);
          }

          // -----------------------------------------------------------
          // 3. Monta os grupos visuais (mesmas seções do GET)
          // -----------------------------------------------------------
          const groupSections = [
            ['Dados Pessoais', 'Informacoes_Pessoais_e_Contato'],
            ['Endereço Residencial', 'Endereco'],
            ['Documentação', 'Documentos'],
            ['Família e Cônjuge', 'Familiar_e_Conjuge'],
            ['Estrutura Contratual', 'Dados_Contratuais_e_Organizacao'],
            ['Financeiro e Jornada', 'Financeiro_Jornada_e_Experiencia'],
            ['Adicionais e Incidências', 'Adicionais_e_Incidencias'],
            ['Dados Bancários', 'Dados_Bancarios_e_Pagamento'],
            ['Benefícios e Vales', 'Beneficios'],
            ['FGTS e Registros Legais', 'FGTS_e_Registros_Legais'],
            ['Banco de Horas', 'Banco_de_Horas'],
            ['Dados de Estrangeiro', 'Dados_Estrangeiro'],
            ['Deficiências / PCD', 'Deficiencias_PCD'],
            ['Logs e Auditoria', 'Logs_Auditoria_e_Arquivos']
          ];

          const groupsHtml = groupSections
            .map(([titulo, key]) => {
              return `
                <div class="group-box">
                  <div class="group-title">${titulo}</div>
                  <table class="data-table">${renderTableRows(funcionarioAgrupado[key])}</table>
                </div>`;
            })
            .join('');

          // -----------------------------------------------------------
          // 4. HTML final do painel (bru.visualize)
          // -----------------------------------------------------------
          const html = `
            <!DOCTYPE html>
            <html lang="pt-BR">
            <head>
            <meta charset="utf-8">
            <style>
              :root {
                --bg: #f5f6f8; --surface: #ffffff; --surface-alt: #fafbfc; --border: #e2e5eb;
                --text: #1f2430; --text-muted: #6b7280; --primary: #4f46e5; --primary-soft: #eef0ff;
                --green: #059669; --green-soft: #ecfdf5; --red: #dc2626; --red-soft: #fef2f2;
                --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
              }
              * { box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; font-size: 14px; }

              .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
              .header h2 { margin: 0; font-size: 19px; font-weight: 700; }
              .func-id-tag { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
              .badges { display: flex; gap: 6px; }
              .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
              .badge-ativo { background: var(--green-soft); color: var(--green); }
              .badge-inativo { background: var(--red-soft); color: var(--red); }
              .badge-info { background: var(--primary-soft); color: var(--primary); }

              .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
              .tab-button { background: transparent; color: var(--text-muted); border: none; padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; border-bottom: 2px solid transparent; }
              .tab-button:hover { color: var(--text); }
              .tab-button.active { color: var(--primary); border-bottom-color: var(--primary); }
              .tab-content { display: none; }
              .tab-content.active { display: block; }

              .toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
              .toolbar-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
              .toolbar-btn:hover { background: var(--surface-alt); color: var(--text); }

              .inner-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
              .group-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); }
              .group-title { font-size: 11.5px; color: var(--primary); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
              .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
              .data-table tr { border-bottom: 1px solid var(--border); }
              .data-table tr:last-child { border-bottom: none; }
              .data-table td { padding: 5px 2px; vertical-align: top; }
              .prop-name { color: var(--text-muted); width: 48%; }
              .prop-value { color: var(--text); text-align: right; width: 52%; word-break: break-word; font-weight: 500; }
              .val-null { color: #a1a5b0; font-style: italic; font-weight: 400; }
              .val-bool.true { color: var(--green); font-weight: 700; }
              .val-bool.false { color: var(--red); font-weight: 700; }

              pre { background: #1e1e24; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; color: #a5d6a7; font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.55; margin: 0; }
            </style>
            </head>
            <body>

              <div class="header">
                <div>
                  <h2>${funcionarioAgrupado.nome || 'Nome não informado'}</h2>
                  <span class="func-id-tag">ID ${funcionarioAgrupado.funcionario_contribuinte_id ?? '—'}</span>
                </div>
                <div class="badges">
                  <span class="badge ${funcionarioAgrupado.cadastro_ativo ? 'badge-ativo' : 'badge-inativo'}">${funcionarioAgrupado.cadastro_ativo ? 'Ativo' : 'Inativo'}</span>
                  <span class="badge badge-info">${funcionarioAgrupado.situacao ? String(funcionarioAgrupado.situacao).replace(/_/g, ' ') : '—'}</span>
                </div>
              </div>

              <div class="tabs">
                <button class="tab-button active" onclick="switchTab(event, 'visual-panel')">Painel Visual</button>
                <button class="tab-button" onclick="switchTab(event, 'raw-json')">JSON Original</button>
              </div>

              <div id="visual-panel" class="tab-content active">
                <div class="group-box" style="margin-bottom:12px;">
                  <div class="group-title">Controle Geral</div>
                  <table class="data-table">
                    <tr><td class="prop-name">empresa_id</td><td class="prop-value">${renderVal(funcionarioAgrupado.empresa_id)}</td></tr>
                    <tr><td class="prop-name">v_funcionario_contribuinte_id</td><td class="prop-value">${renderVal(funcionarioAgrupado.v_funcionario_contribuinte_id)}</td></tr>
                    <tr><td class="prop-name">id_admissao_preliminar</td><td class="prop-value">${renderVal(funcionarioAgrupado.id_admissao_preliminar)}</td></tr>
                    <tr><td class="prop-name">v_id_admissao_preliminar</td><td class="prop-value">${renderVal(funcionarioAgrupado.v_id_admissao_preliminar)}</td></tr>
                    <tr><td class="prop-name">tipo</td><td class="prop-value">${renderVal(funcionarioAgrupado.tipo)}</td></tr>
                    <tr><td class="prop-name">nome_social</td><td class="prop-value">${renderVal(funcionarioAgrupado.nome_social)}</td></tr>
                  </table>
                </div>
                <div class="inner-content">
                  ${groupsHtml}
                </div>
              </div>

              <div id="raw-json" class="tab-content">
                <div class="toolbar"><button class="toolbar-btn" onclick="copyJson()">Copiar JSON</button></div>
                <pre id="jsonRaw"><code>${JSON.stringify(jsonOriginal, null, 2)}</code></pre>
              </div>

              <script>
                function switchTab(evt, tabId) {
                  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                  document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
                  document.getElementById(tabId).classList.add('active');
                  evt.currentTarget.classList.add('active');
                }
                function copyJson() {
                  const text = document.getElementById('jsonRaw').innerText;
                  navigator.clipboard.writeText(text).then(() => {
                    const btn = event.currentTarget;
                    const original = btn.innerText;
                    btn.innerText = 'Copiado!';
                    setTimeout(() => { btn.innerText = original; }, 1500);
                  });
                }
              </script>
            </body>
            </html>
          `;

          // Executa o motor nativo do Bruno para gerar o painel Visualizer
          bru.visualize('html', {
            name: 'Funcionário Cadastrado',
            content: html
          });
        }

