docs: |-
  Cadastra um novo funcionário ou contribuinte com todos os dados cadastrais, profissionais e documentais.O recurso de admissão completa é destinado a criar um registro de funcionário ou contribuinte com o máximo de detalhes possível. Ele inclui campos para informações pessoais, dados profissionais, documentos e outros detalhes relevantes para a admissão.
   * Campos obrigatórios mínimos para criação: `empresa_id`, `tipo`, `nome` e `cpf`. O campo `tipo` deve ser preenchido com o valor correspondente ao tipo de admissão (funcionario ou contribuinte) conforme definido na enumeração TipoAdmissaoEnum.
   * **Revise o recurso antes de enviar e garanta que todos os campos necessários estejam preenchidos. Campos não enviados serão considerados nulos**
