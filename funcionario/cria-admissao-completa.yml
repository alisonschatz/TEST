runtime:
  scripts:
    - type: before-request
      code: |-
        // =============================================================
        // PRE-REQUEST SCRIPT - BRUNO
        // Lê o body agrupado por seções lógicas (aba Body) e "achata"
        // para o formato plano que a API espera no envio real.
        //
        // Opcionalmente, gera dados aleatórios para agilizar testes.
        // Ative colocando a variável "usarDadosAleatorios" = true na aba
        // Vars da requisição (ou no ambiente). Só preenche campos que já
        // estão null — o que você digitar manualmente é sempre respeitado.
        //
        // De propósito, NÃO geramos valores aleatórios para:
        //  - empresa_id (depende do seu ambiente/empresa)
        //  - qualquer *_id que referencia tabela de domínio do seu sistema
        //    (banco_id, departamento_id, funcao_id, sindicato_id, etc.) —
        //    um ID aleatório quase certamente não existe no seu cadastro e
        //    a API vai rejeitar a criação.
        // Esses continuam null; preencha com valores válidos do seu ambiente.
        // =============================================================

        // -------------------------------------------------------------
        // INTERRUPTOR: crie uma variável de ambiente chamada
        // "usarDadosAleatorios" (aba de Environment do Bruno) com valor
        // "true" ou "false" — dá pra ligar/desligar sem editar o script,
        // inclusive trocando entre ambientes diferentes.
        // A constante abaixo é só um override manual de emergência: deixe
        // false para o ambiente mandar; mude para true se quiser forçar
        // a geração aleatória independente do ambiente.
        // -------------------------------------------------------------
        const FORCAR_DADOS_ALEATORIOS = false;

        // Dados-base para geração aleatória (ajuste as listas à vontade)
        const NOMES = ['Ana', 'Bruna', 'Carlos', 'Daniela', 'Eduardo', 'Fernanda', 'Gabriel', 'Helena',
          'Igor', 'Juliana', 'Lucas', 'Mariana', 'Nicolas', 'Otávio', 'Patrícia', 'Rafael',
          'Sabrina', 'Thiago', 'Vitória', 'William'];
        const SOBRENOMES = ['Silva', 'Santos', 'Oliveira', 'Souza', 'Rodrigues', 'Ferreira', 'Alves',
          'Pereira', 'Lima', 'Gomes', 'Costa', 'Ribeiro', 'Martins', 'Carvalho', 'Almeida', 'Lopes'];

        const randomFrom = (lista) => lista[Math.floor(Math.random() * lista.length)];
        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const pad = (n, len) => String(n).padStart(len, '0');

        const randomData = (anoIni, anoFim) => {
          const ano = randomInt(anoIni, anoFim);
          const mes = randomInt(1, 12);
          const dia = randomInt(1, 28);
          return `${ano}-${pad(mes, 2)}-${pad(dia, 2)}`;
        };

        const hojeISO = () => new Date().toISOString().slice(0, 10);

        const gerarCPF = () => `${pad(randomInt(0, 999), 3)}.${pad(randomInt(0, 999), 3)}.${pad(randomInt(0, 999), 3)}-${pad(randomInt(0, 99), 2)}`;

        const gerarTelefone = () => `47 9${randomInt(1000, 9999)}-${randomInt(1000, 9999)}`;

        // A API valida CEP (e aparentemente o conjunto endereço/bairro) contra
        // dados reais — inventar um CEP, mesmo com formato correto, é rejeitado.
        // Por isso usamos combinações reais e válidas de CEP + rua + bairro,
        // já testadas. Adicione mais linhas aqui se tiver outros endereços
        // válidos no seu ambiente, pra ter mais variedade.
        const ENDERECOS_VALIDOS = [
          { cep: '89036-770', rua: 'César Silveira', bairro: 'Velha' }
        ];

        // Mapa campo -> gerador. A ordem importa:
        //  - "email" usa o "nome" já gerado antes dele
        //  - "endereco" e "endereco_bairro" usam o mesmo endereço sorteado
        //    por "endereco_cep", pra não misturar CEP de um bairro com rua
        //    de outro
        const CAMPOS_ALEATORIOS = {
          nome: () => `${randomFrom(NOMES)} ${randomFrom(SOBRENOMES)} Teste`,
          email: (ctx) => {
            const base = (ctx.nome || 'usuario teste').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '.');
            return `${base}${randomInt(1, 999)}@teste.com`;
          },
          sexo: () => randomFrom(['masculino', 'feminino']),
          nascimento_data: () => randomData(1970, 2005),
          telefone: () => gerarTelefone(),
          celular: () => gerarTelefone(),
          cpf: () => gerarCPF(),
          endereco_cep: (ctx) => {
            ctx.enderecoEscolhido = randomFrom(ENDERECOS_VALIDOS);
            return ctx.enderecoEscolhido.cep;
          },
          endereco: (ctx) => (ctx.enderecoEscolhido || ENDERECOS_VALIDOS[0]).rua,
          endereco_numero: () => String(randomInt(1, 999)),
          endereco_bairro: (ctx) => (ctx.enderecoEscolhido || ENDERECOS_VALIDOS[0]).bairro,
          salario_base: () => randomInt(1800, 8000),
          forma_pagamento: () => 'mensal',
          hora_mensal: () => 220,
          hora_semanal: () => 44,
          hora_diaria: () => 8,
          admissao_data: () => hojeISO(),
          cadastro_data: () => hojeISO(),
          data_adicional_tempo_servico_inicio: () => hojeISO()
        };

        const bodyAgrupado = req.getBody();

        if (bodyAgrupado && typeof bodyAgrupado === 'object' && !Array.isArray(bodyAgrupado)) {
          const bodyPlano = {};

          Object.keys(bodyAgrupado).forEach((key) => {
            const valor = bodyAgrupado[key];
            const ehGrupo = valor && typeof valor === 'object' && !Array.isArray(valor);

            if (ehGrupo) {
              // Grupo lógico (ex: Informacoes_Pessoais_e_Contato) -> joga os filhos pra raiz
              Object.assign(bodyPlano, valor);
            } else {
              // Campo solto na raiz (ex: nome, empresa_id) -> mantém como está
              bodyPlano[key] = valor;
            }
          });

          // -----------------------------------------------------------
          // Preenchimento com dados aleatórios (opcional)
          // -----------------------------------------------------------
          const valorEnv = String(bru.getEnvVar('usarDadosAleatorios') || '').toLowerCase() === 'true';
          const usarAleatorio = FORCAR_DADOS_ALEATORIOS || valorEnv;

          console.log(`[POST] usarDadosAleatorios (ambiente) = ${bru.getEnvVar('usarDadosAleatorios')} | FORCAR_DADOS_ALEATORIOS (script) = ${FORCAR_DADOS_ALEATORIOS} | resultado final = ${usarAleatorio}`);

          if (usarAleatorio) {
            const contexto = {};
            const camposPreenchidos = [];
            Object.keys(CAMPOS_ALEATORIOS).forEach((campo) => {
              const valorAtual = bodyPlano[campo];
              const estaVazio = valorAtual === null || valorAtual === undefined || valorAtual === '';
              if (estaVazio) {
                bodyPlano[campo] = CAMPOS_ALEATORIOS[campo](contexto);
                camposPreenchidos.push(campo);
              }
              contexto[campo] = bodyPlano[campo];
            });
            console.log(`[POST] Campos preenchidos aleatoriamente: ${camposPreenchidos.join(', ') || '(nenhum — todos já tinham valor)'}`);
          }

          // Guarda o body agrupado original em uma variável de requisição.
          // Isso permite reconstruir a visão organizada no post-response,
          // já que o retorno da API normalmente vem achatado também,
          // e também permite mostrar "o que foi enviado" no painel visual.
          bru.setVar('bodyAgrupadoOriginal', JSON.stringify(bodyAgrupado));
          bru.setVar('bodyPlanoEnviado', JSON.stringify(bodyPlano));

          req.setBody(bodyPlano);
        }
    - type: after-response
      code: |-
        // =============================================================
        // POST-RESPONSE SCRIPT - BRUNO
        // Mesmo padrão do GET: agrupa o retorno da API em seções lógicas,
        // salva com res.setBody() e gera um painel visual (bru.visualize).
        // Aqui a resposta é um único registro (não uma lista).
        // =============================================================

        // -------------------------------------------------------------
        // Helpers (const/arrow no topo do script)
        // -------------------------------------------------------------
        const renderVal = (val) => {
          if (val === null || val === undefined) return '<span class="val-null">null</span>';
          if (typeof val === 'boolean') return `<span class="val-bool ${val ? 'true' : 'false'}">${val ? 'true' : 'false'}</span>`;
          if (val === '') return '<span class="val-null">vazio</span>';
          return String(val);
        };

        const renderTableRows = (obj) => {
          if (!obj) return '';
          return Object.keys(obj)
            .map((key) => `<tr><td class="prop-name">${key}</td><td class="prop-value">${renderVal(obj[key])}</td></tr>`)
            .join('');
        };

        // -------------------------------------------------------------
        // 1. Salva cópia do JSON original antes de qualquer alteração
        // -------------------------------------------------------------
        const jsonOriginal = JSON.parse(JSON.stringify(res.getBody()));
        const body = res.getBody();

        // A API embrulha o registro dentro de "retorno", junto com
        // sucesso/status/mensagem. É de lá que os dados reais vêm.
        if (body && body.retorno) {
          const f = body.retorno;

          // -----------------------------------------------------------
          // 2. Reestrutura o retorno em grupos lógicos
          //    (mesmo mapeamento de campos usado no GET)
          // -----------------------------------------------------------
          const funcionarioAgrupado = {
            empresa_id: f.empresa_id,
            funcionario_contribuinte_id: f.funcionario_contribuinte_id,
            v_funcionario_contribuinte_id: f.v_funcionario_contribuinte_id,
            id_admissao_preliminar: f.id_admissao_preliminar,
            v_id_admissao_preliminar: f.v_id_admissao_preliminar,
            tipo: f.tipo,
            situacao: f.situacao,
            cadastro_ativo: f.cadastro_ativo,
            nome: f.nome,
            nome_social: f.nome_social,

            Informacoes_Pessoais_e_Contato: {
              email: f.email,
              telefone: f.telefone,
              celular: f.celular,
              sexo: f.sexo,
              nascimento_data: f.nascimento_data,
              nascimento_cidade_id: f.nascimento_cidade_id,
              estado_civil_id: f.estado_civil_id,
              etnia_id: f.etnia_id,
              tipo_sanguineo_id: f.tipo_sanguineo_id,
              nacionalidade_id: f.nacionalidade_id,
              grau_instrucao_id: f.grau_instrucao_id,
              possui_sinais_corpo: f.possui_sinais_corpo
            },

            Documentos: {
              cpf: f.cpf,
              rg: f.rg,
              rg_orgao_emissor: f.rg_orgao_emissor,
              rg_emissao: f.rg_emissao,
              rg_uf: f.rg_uf,
              pis_numero: f.pis_numero,
              pis_emissao: f.pis_emissao,
              titulo_eleitor: f.titulo_eleitor,
              titulo_eleitor_zona: f.titulo_eleitor_zona,
              titulo_eleitor_secao: f.titulo_eleitor_secao,
              carteira_trabalho: f.carteira_trabalho,
              carteira_trabalho_serie: f.carteira_trabalho_serie,
              carteira_trabalho_serie_digito: f.carteira_trabalho_serie_digito,
              carteira_trabalho_emissao: f.carteira_trabalho_emissao,
              carteira_trabalho_uf: f.carteira_trabalho_uf,
              cnh: f.cnh,
              cnh_uf: f.cnh_uf,
              cnh_categoria: f.cnh_categoria,
              cnh_emissao: f.cnh_emissao,
              cnh_vencimento: f.cnh_vencimento,
              cnh_primeira_habilitacao: f.cnh_primeira_habilitacao,
              certificado_reservista: f.certificado_reservista,
              ric_numero: f.ric_numero,
              ric_orgao_emissor: f.ric_orgao_emissor,
              ric_emissao: f.ric_emissao,
              oc_numero: f.oc_numero,
              oc_orgao_emissor: f.oc_orgao_emissor,
              oc_emissao: f.oc_emissao,
              oc_vencimento: f.oc_vencimento
            },

            Endereco: {
