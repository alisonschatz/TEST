info:
  name: Lista funções paginadas
  type: http
  seq: 1
  tags:
    - Função

http:
  method: GET
  url: "{{baseUrl}}/api/v1/funcoes?empresa_id=900002"
  params:
    - name: empresa_id
      value: "900002"
      type: query
    - name: page
      value: "1"
      type: query
      description: Página atual
      disabled: true
    - name: funcao_id
      value: "7"
      type: query
      description: Filtra pelo ID exato da função
      disabled: true
    - name: alterado_data
      value: 2026-01-01 00:00:00
      type: query
      description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista paginada de funções
    request:
      url: "{{baseUrl}}/api/v1/funcao"
      method: GET
      params:
        - name: empresa_id
          value: "12345"
          type: query
          description: ID da empresa vinculada ao usuário
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: funcao_id
          value: "7"
          type: query
          description: Filtra pelo ID exato da função
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
    response:
      status: 200
      statusText: OK
