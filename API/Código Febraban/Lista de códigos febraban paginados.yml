info:
  name: Lista de códigos febraban paginados
  type: http
  seq: 1
  tags:
    - Código Febraban

http:
  method: GET
  url: "{{baseUrl}}/api/v1/codigos-febraban"
  params:
    - name: alterado_data
      value: 2026-01-01 00:00:00
      type: query
      disabled: true
    - name: page
      value: "20"
      type: query
      disabled: true
    - name: codigo_febraban
      value: "1"
      type: query
      description: Filtra pelo código exato do febraban
      disabled: true
    - name: banco
      value: Banco do Brasil
      type: query
      description: Filtra pelo nome do banco
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lista paginada de códigos febraban
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: codigo_febraban
          value: "1234"
          type: query
          description: Filtra pelo código exato do febraban
        - name: banco
          value: Banco Exemplo
          type: query
          description: Filtra pelo nome do banco
        - name: alterado_data
          value: 2026-01-01 00:00:00
          type: query
          description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "codigo_febraban": 1234,
                "banco": "Banco Exemplo",
                "log_cadastro_data": "2026-05-14 10:00:00",
                "log_alterado_data": "2026-05-14 12:00:00"
              }
            ]
          }
