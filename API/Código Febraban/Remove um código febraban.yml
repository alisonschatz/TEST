info:
  name: Remove um código febraban
  type: http
  seq: 4
  tags:
    - Código Febraban

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/codigos-febraban"
  body:
    type: json
    data: |-
      {
        "codigo_febraban": 1234
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Código febraban removido com sucesso
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro excluído com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 409 Response
    description: "Código febraban em uso: exclusão bloqueada por dependências"
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/codigoFebraban"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "codigo_febraban": 1234
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Remove um código febraban pelo codigo_febraban. A exclusão é bloqueada se o código estiver em uso por outros registros no sistema. Disponível apenas para sistemas desktop e usuários do tipo Pessoa.
