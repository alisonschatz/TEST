info:
  name: Cadastra novas agências bancárias
  type: http
  seq: 2
  tags:
    - Agência

http:
  method: POST
  url: "{{baseUrl}}/api/v1/agencia"
  headers:
    - name: Authorization
      value: Bearer {{token_atual}}
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "v_agencia_id": 21000,
            "banco_id": 102372,
            "nome_agencia": "Agência Central",
            "numero_agencia": "100",
            "digito": "5",
            "endereco_cidade_id": 4200804,
            "endereco_cep": "89036770",
            "endereco_logradouro_id": 1,
            "endereco": "Rua das Flores",
            "endereco_numero": 1278,
            "endereco_complemento": "teste",
            "endereco_bairro": "Centro",
            "telefone": "(48) 3333-0000",
            "celular": "(48) 3333-0000",
            "email": "agencia@email.com"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
