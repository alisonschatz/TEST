    description: Agências bancárias cadastradas com sucesso
    request:
      url: "{{baseUrl}}/api/v1/agencia"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "v_agencia_id": 1,
                "banco_cadastro_id": 5,
                "nome_agencia": "Agência Central",
                "numero_agencia": "0001",
                "digito": "1",
