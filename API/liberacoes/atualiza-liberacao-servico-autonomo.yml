info:
  name: Atualiza o status de liberação de um serviço autônomo
  type: http
  seq: 3
  tags:
    - Liberações

http:
  method: POST
  url: "{{baseUrl}}/api/v1/liberacao/autonomo/servico"
  body:
    type: json
    data: |-
      {
        "id": 128263197,
        "empresa_id": 900001,
        "situacao": "",
        "observacao_liberacao": "Liberado após conferência de documentos."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Registro atualizado com sucesso para serviço autônomo.
    request:
      url: "{{baseUrl}}/api/v1/liberacao/autonomo/servico"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 128263197,
            "empresa_id": 900001,
            "situacao": "",
            "observacao_liberacao": "Liberado após conferência de documentos."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/liberacao/autonomo/servico"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 128263197,
            "empresa_id": 900001,
            "situacao": "",
            "observacao_liberacao": "Liberado após conferência de documentos."
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/liberacao/autonomo/servico"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 128263197,
            "empresa_id": 900001,
            "situacao": "",
            "observacao_liberacao": "Liberado após conferência de documentos."
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação ou registro não encontrado
    request:
      url: "{{baseUrl}}/api/v1/liberacao/autonomo/servico"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 128263197,
            "empresa_id": 900001,
            "situacao": "",
            "observacao_liberacao": "Liberado após conferência de documentos."
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Atualiza o status de liberação (liberacao_id) e a observação de liberação de um serviço prestado por autônomo.
