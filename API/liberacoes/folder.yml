info:
  name: Liberações
  type: folder
  seq: 5

request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        // ============================================================================
        // Login automático de perfil (executa antes de QUALQUER request desta pasta)
        // ----------------------------------------------------------------------------
        // Cada request herda "auth: inherit", que por sua vez herda o Bearer {{token}}
        // configurado aqui na pasta. Isso garante que qualquer endpoint possa ser
        // disparado de forma independente durante um teste manual, sem depender da
        // execução prévia de uma requisição de "login".
        //
        // O login é feito via Basic Auth: user = token de SISTEMA, pass = token de
        // CONTEXTO. Ambos são fixos e vêm da environment (tokens_sistema /
        // tokens_contexto).
        //
        // O perfil (1 a 8) é escolhido pela variável de ambiente "perfil_escolhido".
        // ============================================================================

                const PERFIS = [
                  { nome: "Perfil 1 - Único · Cliente/Empresa",                              sistema: "unico",    contexto: "cliente_unico" },
                  { nome: "Perfil 2 - Único · Administrador/Contabilidade",                  sistema: "unico",    contexto: "adm_unico" },
                  { nome: "Perfil 3 - Practice · Cliente/Empresa",                           sistema: "practice", contexto: "cliente_practice" },
                  { nome: "Perfil 4 - Practice · Administrador/Contabilidade",               sistema: "practice", contexto: "adm_practice" },
                  { nome: "Perfil 5 - Parceiro (via Único) · Cliente/Empresa",               sistema: "parceiro", contexto: "cliente_unico" },
                  { nome: "Perfil 6 - Parceiro (via Único) · Administrador/Contabilidade",   sistema: "parceiro", contexto: "adm_unico" },
                  { nome: "Perfil 7 - Parceiro (via Practice) · Cliente/Empresa",            sistema: "parceiro", contexto: "cliente_practice" },
                  { nome: "Perfil 8 - Parceiro (via Practice) · Administrador/Contabilidade",sistema: "parceiro", contexto: "adm_practice" },
                ];

                const perfilEscolhido = Number(bru.getEnvVar("perfil_escolhido")) || 2;
                const perfil = PERFIS[perfilEscolhido - 1];

                if (!perfil) {
                  console.error(`Erro: o perfil número ${perfilEscolhido} não existe! Escolha de 1 a 8.`);
                  return;
                }

                let tokensSistema = bru.getEnvVar("tokens_sistema");
                if (typeof tokensSistema === "string") tokensSistema = JSON.parse(tokensSistema);

                let tokensContexto = bru.getEnvVar("tokens_contexto");
                if (typeof tokensContexto === "string") tokensContexto = JSON.parse(tokensContexto);

                const tokenSistema = tokensSistema[perfil.sistema];
                const tokenContexto = tokensContexto[perfil.contexto];

                if (!tokenSistema || !tokenContexto) {
                  console.error(`Erro: token de sistema/contexto ausente para o perfil "${perfil.nome}".`);
                  return;
                }

                console.log(`>>> Autenticando com: ${perfil.nome}`);

                const axios = require("axios");
                const credenciaisBase64 = btoa(`${tokenSistema}:${tokenContexto}`);

                try {
                  const resposta = await axios.post(
                    `${bru.getEnvVar("authUrl")}/api/v1/auth/credencial/login`,
                    {},
                    { headers: { Authorization: `Basic ${credenciaisBase64}` } }
                  );

                  if (resposta.data && resposta.data.token) {
                    bru.setVar("token", resposta.data.token);
                  } else {
                    console.error("Login não retornou token.");
                  }
                } catch (error) {
                  console.error("Erro ao autenticar perfil automaticamente:", error.message);
                }
