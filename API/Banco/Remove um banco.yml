info:
  name: Remove um banco
  type: http
  seq: 4
  tags:
    - Banco

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/bancos"
  headers:
    - name: Authorization
      value: Bearer {{token_atual}}
  body:
    type: json
    data: |-
      {
        "banco_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Exclusão realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "banco_id": 1
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro excluído com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "banco_id": 1
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "banco_id": 1
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Agências vinculadas ou validação
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "banco_id": 1
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/bancos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "banco_id": 1
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Remove um banco do sistema. Retorna 422 se existirem agências vinculadas ao banco. Restrito a usuários do tipo PESSOA (1) com token de sistema.
