info:
  name: Remove um lançamento de banco de horas
  type: http
  seq: 8
  tags:
    - Bancos de Horas

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
  body:
    type: json
    data: |-
      {
        "empresa_id": 900001,
        "lancamento_id": 42
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Exclusão realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Registro excluído com sucesso",
            "retorno": []
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: "Remove um lançamento de banco de horas do sistema. Disponível apenas via sistema desktop. O lançamento deve existir dentro do cliente/empresa informados, caso contrário retorna Status Code 422. Lançamentos referenciados por outros registros não podem ser removidos. ATENÇÃO: Essa ação não poderá ser desfeita."
