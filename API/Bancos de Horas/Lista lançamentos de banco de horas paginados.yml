info:
  name: Lista lançamentos de banco de horas paginados
  type: http
  seq: 5
  tags:
    - Bancos de Horas

http:
  method: GET
  url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
  params:
    - name: empresa_id
      value: "12345"
      type: query
      description: ID da empresa vinculada ao usuário
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: lancamento_id
      value: "42"
      type: query
      description: Filtra pelo ID exato do lançamento
    - name: data
      value: 2026-06-10
      type: query
      description: Filtra pela data exata do lançamento (Y-m-d)
    - name: situacao
      value: nao_liberado
      type: query
      description: Filtra pela situação de liberação do lançamento
      disabled: true
    - name: situacao
      value: liberado
      type: query
      description: Filtra pela situação de liberação do lançamento
      disabled: true
    - name: situacao
      value: integrado
      type: query
      description: Filtra pela situação de liberação do lançamento
      disabled: true
    - name: situacao
      value: recusado
      type: query
      description: Filtra pela situação de liberação do lançamento
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

