info:
  name: Lista paginada de configurações de banco de horas
  type: http
  seq: 1
  tags:
    - Bancos de Horas

http:
  method: GET
  url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
  params:
    - name: sistema_id
      value: "19"
      type: query
      description: ID do sistema (19=VISUAL, 52=UNICO).
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: alterado_data
      value: 2024-01-01 00:00:00
      type: query
      description: Filtra registros alterados a partir desta data (sincronização incremental)
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Resposta com lista paginada de configurações
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: GET
      params:
        - name: sistema_id
          value: "19"
          type: query
          description: ID do sistema (19=VISUAL, 52=UNICO).
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas padrão",
                "observacao": "Observações gerais sobre a configuração",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: GET
      params:
        - name: sistema_id
          value: "19"
          type: query
          description: ID do sistema (19=VISUAL, 52=UNICO).
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: GET
      params:
        - name: sistema_id
          value: "19"
          type: query
          description: ID do sistema (19=VISUAL, 52=UNICO).
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: GET
      params:
        - name: sistema_id
          value: "19"
          type: query
          description: ID do sistema (19=VISUAL, 52=UNICO).
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Retorna uma lista paginada de configurações de banco de horas do cliente, filtradas pelo sistema informado. Acessível por usuários do tipo Pessoa e Empresa via qualquer sistema.
