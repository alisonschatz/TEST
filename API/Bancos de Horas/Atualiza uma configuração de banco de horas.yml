info:
  name: Atualiza uma configuração de banco de horas
  type: http
  seq: 2
  tags:
    - Bancos de Horas

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
  body:
    type: json
    data: |-
      {
        "sistema_id": 19,
        "v_configuracao_id": 123456,
        "descricao": "Configuração atualizada",
        "observacao": "Observações atualizadas"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Atualização realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: PUT
      body:
        type: json
        data: |-
          {
            "sistema_id": 19,
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": {
              "v_configuracao_id": 123456,
              "descricao": "Configuração de banco de horas padrão",
              "observacao": "Observações gerais sobre a configuração",
              "log_cadastro_data": "2024-01-01 00:00:00",
              "log_alterado_data": "2024-06-01 00:00:00"
            }
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: PUT
      body:
        type: json
        data: |-
          {
            "sistema_id": 19,
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: PUT
      body:
        type: json
        data: |-
          {
            "sistema_id": 19,
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 404 Response
    description: Registro não encontrado
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: PUT
      body:
        type: json
        data: |-
          {
            "sistema_id": 19,
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/configuracoes"
      method: PUT
      body:
        type: json
        data: |-
          {
            "sistema_id": 19,
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Atualiza os dados de uma configuração identificada por sistema_id e v_configuracao_id. Suporta atualização parcial — apenas os campos enviados serão atualizados. Restrito a usuários do tipo Pessoa via sistema SCI.
