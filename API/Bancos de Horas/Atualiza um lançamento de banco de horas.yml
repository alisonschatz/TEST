info:
  name: Atualiza um lançamento de banco de horas
  type: http
  seq: 6
  tags:
    - Bancos de Horas

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
  body:
    type: json
    data: |-
      {
        "empresa_id": 900001,
        "lancamento_id": 42,
        "funcionario_contribuinte_id": 15,
        "data": "2026-06-10",
        "credito": "08:00:00",
        "debito": null
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lançamento atualizado com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "empresa_id": 900001,
            "lancamento_id": 42,
            "funcionario_contribuinte_id": 15,
            "data": "2026-06-10",
            "credito": "08:00:00",
            "debito": null
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": {
              "cliente_id": 1234,
              "empresa_id": 900001,
