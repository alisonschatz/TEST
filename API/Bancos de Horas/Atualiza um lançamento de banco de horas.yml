docs: "Atualiza um lançamento de banco de horas. A chave lancamento_id é usada para localizar o registro. ATENÇÃO: DEVE SER ENVIADO TODOS OS CAMPOS DO REGISTRO, OS VALORES ENVIADOS VAZIOS SERÃO LIMPOS."
