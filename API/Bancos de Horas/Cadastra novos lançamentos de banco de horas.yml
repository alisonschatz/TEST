info:
  name: Cadastra novos lançamentos de banco de horas
  type: http
  seq: 7
  tags:
    - Bancos de Horas

http:
  method: POST
  url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": 900002,
            "funcionario_contribuinte_id": 32845938,
            "data": "2026-06-10",
            "credito": "08:01:00",
            "debito": null
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lançamentos cadastrados com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00:00",
                "debito": null
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "cliente_id": 1234,
                "empresa_id": 900001,
                "lancamento_id": 42,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00",
                "debito": null,
                "situacao": "liberado",
                "observacao_liberacao": "Liberado após conferência.",
                "log_cadastro_data": "2026-06-10 10:00:00",
                "log_alterado_data": "2026-06-10 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro de autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00:00",
                "debito": null
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 403 Response
    description: Erro de permissão
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00:00",
                "debito": null
              }
            ]
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 403,
            "mensagem": "Você não tem permissão para realizar esta ação.",
            "erros": {
              "dados.0.empresa_id": [
                "Usuário não está vinculado a essa empresa."
              ]
            }
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00:00",
                "debito": null
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 500 Response
    description: Erro interno
    request:
      url: "{{baseUrl}}/api/v1/bancos-horas/lancamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "funcionario_contribuinte_id": 15,
                "data": "2026-06-10",
                "credito": "08:00:00",
                "debito": null
              }
            ]
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Permite cadastrar múltiplos lançamentos de uma só vez através de um array de dados. O lancamento_id é gerado automaticamente. É obrigatório informar 'credito' ou 'debito'. Não é permitida a duplicidade da combinação de empresa, funcionário, data, crédito e débito.
