info:
  name: Lista Admissões Completas
  type: http
  seq: 1
  tags:
    - Funcionário

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admissoes/completas?empresa_id=900002"
  params:
    - name: empresa_id
      value: "900002"
      type: query
    - name: funcionario_contribuinte_id
      value: ""
      type: query
      disabled: true
    - name: tipo
      value: funcionario
      type: query
      description: Filtrar por tipo de admissão
      disabled: true
    - name: tipo
      value: contribuinte
      type: query
      description: Filtrar por tipo de admissão
      disabled: true
    - name: situacao
      value: integrado
      type: query
      description: |-
        Filtrar por situação do cadastro do colaborador. Envie o identificador textual correspondente ao estado desejado. Valores aceitos (definidos em SituacaoLiberacaoEnum, verificar schema `SituacaoLiberacaoEnum`):
         *  integrado - Registro integrado com sucesso.
         *  liberado - Registro liberado para integração.
         *  nao_liberado - Registro não liberado para integração.
         *  aguardando_integracao - Registro aguardando conclusão da integração.
         *  recusado - Registro recusado na importação. É necessário corrigir antes de realizar nova liberação.
      disabled: true
    - name: alterado_data
      value: ""
      type: query
      description: |-
        Filtrar registros alterados a partir de uma determinada data. Retorna todos os cadastros cuja data de última alteração (`alterado_data`) seja **igual ou posterior** à data informada. Aceita os formatos de data (YYYY-MM-DD ou YYYY-MM-DD HH:MM:SS).
         * Exemplo: informando `2026-03-25`, serão retornados todos os registros alterados no dia 25/03/2026 ou depois.
      disabled: true
    - name: v_funcionario_contribuinte_id
      value: ""
      type: query
      description: Filtrar pelo ID legado do funcionário/contribuinte
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Página atual
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // =============================================================
        // POST-RESPONSE SCRIPT - BRUNO
        // Estrutura o retorno da API em grupos lógicos e gera um painel
        // visual (bru.visualize) para inspeção rápida dos dados.
        // =============================================================

        // -------------------------------------------------------------
        // Helpers (declarados como const/arrow function no topo do script
        // para evitar o erro "Function declarations should not be placed
        // in blocks" do linter do Bruno)
        // -------------------------------------------------------------
        const renderVal = (val) => {
          if (val === null || val === undefined) return '<span class="val-null">null</span>';
          if (typeof val === 'boolean') return `<span class="val-bool ${val ? 'true' : 'false'}">${val ? 'true' : 'false'}</span>`;
          if (val === '') return '<span class="val-null">vazio</span>';
          return String(val);
        };

        const renderTableRows = (obj) => {
          if (!obj) return '';
          return Object.keys(obj)
            .map((key) => {
              return `<tr><td class="prop-name">${key}</td><td class="prop-value">${renderVal(obj[key])}</td></tr>`;
            })
            .join('');
        };

        const countBy = (arr, predicate) => arr.reduce((acc, item) => acc + (predicate(item) ? 1 : 0), 0);

        // -------------------------------------------------------------
        // 1. Salva cópia do JSON original antes de qualquer alteração
        // -------------------------------------------------------------
        const jsonOriginal = JSON.parse(JSON.stringify(res.getBody()));
        const body = res.getBody();

        if (body && body.retorno) {
          // -----------------------------------------------------------
          // 2. Reestrutura cada funcionário em grupos lógicos
          // -----------------------------------------------------------
          const retornoAgrupado = body.retorno.map((f) => {
            return {
              empresa_id: f.empresa_id,
              funcionario_contribuinte_id: f.funcionario_contribuinte_id,
              v_funcionario_contribuinte_id: f.v_funcionario_contribuinte_id,
              id_admissao_preliminar: f.id_admissao_preliminar,
              v_id_admissao_preliminar: f.v_id_admissao_preliminar,
              tipo: f.tipo,
              situacao: f.situacao,
              cadastro_ativo: f.cadastro_ativo,
              nome: f.nome,
              nome_social: f.nome_social,

              Informacoes_Pessoais_e_Contato: {
                email: f.email,
                telefone: f.telefone,
                celular: f.celular,
                sexo: f.sexo,
                nascimento_data: f.nascimento_data,
                nascimento_cidade_id: f.nascimento_cidade_id,
                estado_civil_id: f.estado_civil_id,
                etnia_id: f.etnia_id,
                tipo_sanguineo_id: f.tipo_sanguineo_id,
                nacionalidade_id: f.nacionalidade_id,
                grau_instrucao_id: f.grau_instrucao_id,
                possui_sinais_corpo: f.possui_sinais_corpo
              },

              Documentos: {
                cpf: f.cpf,
                rg: f.rg,
                rg_orgao_emissor: f.rg_orgao_emissor,
                rg_emissao: f.rg_emissao,
                rg_uf: f.rg_uf,
                pis_numero: f.pis_numero,
                pis_emissao: f.pis_emissao,
                titulo_eleitor: f.titulo_eleitor,
                titulo_eleitor_zona: f.titulo_eleitor_zona,
                titulo_eleitor_secao: f.titulo_eleitor_secao,
                carteira_trabalho: f.carteira_trabalho,
                carteira_trabalho_serie: f.carteira_trabalho_serie,
                carteira_trabalho_serie_digito: f.carteira_trabalho_serie_digito,
                carteira_trabalho_emissao: f.carteira_trabalho_emissao,
                carteira_trabalho_uf: f.carteira_trabalho_uf,
                cnh: f.cnh,
                cnh_uf: f.cnh_uf,
                cnh_categoria: f.cnh_categoria,
                cnh_emissao: f.cnh_emissao,
                cnh_vencimento: f.cnh_vencimento,
                cnh_primeira_habilitacao: f.cnh_primeira_habilitacao,
                certificado_reservista: f.certificado_reservista,
                ric_numero: f.ric_numero,
                ric_orgao_emissor: f.ric_orgao_emissor,
                ric_emissao: f.ric_emissao,
                oc_numero: f.oc_numero,
                oc_orgao_emissor: f.oc_orgao_emissor,
                oc_emissao: f.oc_emissao,
                oc_vencimento: f.oc_vencimento
              },

              Endereco: {
                endereco_cep: f.endereco_cep,
                endereco_logradouro_id: f.endereco_logradouro_id,
                endereco: f.endereco,
                endereco_numero: f.endereco_numero,
                endereco_complemento: f.endereco_complemento,
                endereco_bairro: f.endereco_bairro,
                endereco_cidade_id: f.endereco_cidade_id
              },

              Familiar_e_Conjuge: {
                mae_nome: f.mae_nome,
                pai_nome: f.pai_nome,
                conjuge_nome: f.conjuge_nome,
                conjuge_nascimento_cidade_id: f.conjuge_nascimento_cidade_id,
                conjuge_nascimento_data: f.conjuge_nascimento_data
              },

              Dados_Contratuais_e_Organizacao: {
                cadastro_data: f.cadastro_data,
                admissao_data: f.admissao_data,
                admissao_tipo_id: f.admissao_tipo_id,
                contrato_tipo_id: f.contrato_tipo_id,
                funcionario_tipo_id: f.funcionario_tipo_id,
                categoria_esocial_id: f.categoria_esocial_id,
                regime_trabalhista_id: f.regime_trabalhista_id,
                regime_previdenciario_id: f.regime_previdenciario_id,
                sindicato_id: f.sindicato_id,
                sindicalizado: f.sindicalizado,
                contribuicao_sindical: f.contribuicao_sindical,
                classe_id: f.classe_id,
                centro_custo_id: f.centro_custo_id,
                departamento_id: f.departamento_id,
                funcao_id: f.funcao_id,
                ocupacao_natureza_id: f.ocupacao_natureza_id,
                matricula_anterior: f.matricula_anterior,
                cnpj_empresa_anterior: f.cnpj_empresa_anterior,
                transferencia_onus: f.transferencia_onus,
                transferencia_data: f.transferencia_data,
                data_adicional_tempo_servico_inicio: f.data_adicional_tempo_servico_inicio,
                data_reintegracao: f.data_reintegracao,
                aposentadoria_data: f.aposentadoria_data,
                desligamento_data: f.desligamento_data,
                entrada_data: f.entrada_data,
                baixa_data: f.baixa_data
              },

              Financeiro_Jornada_e_Experiencia: {
                salario_base: f.salario_base,
                remuneracao: f.remuneracao,
                forma_pagamento: f.forma_pagamento,
                percentual_comissao: f.percentual_comissao,
                hora_mensal: f.hora_mensal,
                hora_semanal: f.hora_semanal,
                hora_diaria: f.hora_diaria,
                regime_jornada_trabalho_id: f.regime_jornada_trabalho_id,
                tipo_jornada_id: f.tipo_jornada_id,
                tipo_jornada_descricao: f.tipo_jornada_descricao,
                tipo_escala_id: f.tipo_escala_id,
                descanso_semanal_id: f.descanso_semanal_id,
                quadro_horario_id: f.quadro_horario_id,
                regime_tempo_parcial: f.regime_tempo_parcial,
                horario_noturno: f.horario_noturno,
                prazo_experiencia: f.prazo_experiencia,
                prazo_experiencia_fim: f.prazo_experiencia_fim,
                prazo_experiencia_prorrogacao: f.prazo_experiencia_prorrogacao,
                prazo_experiencia_prorrogacao_fim: f.prazo_experiencia_prorrogacao_fim,
                beneficio_desemprego: f.beneficio_desemprego
              },

              Adicionais_e_Incidencias: {
                insalubridade_adicional: f.insalubridade_adicional,
                insalubridade_incidencia_id: f.insalubridade_incidencia_id,
                periculosidade_adicional: f.periculosidade_adicional,
                periculosidade_incidencia_id: f.periculosidade_incidencia_id,
                noturno_adicional: f.noturno_adicional,
                noturno_incidencia_id: f.noturno_incidencia_id,
                valor_previdencia_privada: f.valor_previdencia_privada,
                valor_previdencia_privada13: f.valor_previdencia_privada13
              },

              Dados_Bancarios_e_Pagamento: {
                banco_id: f.banco_id,
                banco_conta_agencia: f.banco_conta_agencia,
                banco_conta: f.banco_conta,
                banco_conta_digito: f.banco_conta_digito,
                banco_conta_tipo_id: f.banco_conta_tipo_id,
                banco_modo_pagamento: f.banco_modo_pagamento,
                recebe_adiantamento: f.recebe_adiantamento,
                percentual_adiantamento: f.percentual_adiantamento,
                cartao_salario: f.cartao_salario
              },

              Beneficios: {
                recebe_vale_refeicao: f.recebe_vale_refeicao,
                cartao_vr: f.cartao_vr,
                recebe_vale_alimentacao: f.recebe_vale_alimentacao,
                cartao_va: f.cartao_va,
                recebe_vale_transporte: f.recebe_vale_transporte,
                cartao_vt: f.cartao_vt
              },

              FGTS_e_Registros_Legais: {
                fgts_conta: f.fgts_conta,
                fgts_ocorrencia_id: f.fgts_ocorrencia_id,
                cartao_ponto: f.cartao_ponto,
                ficha_registro: f.ficha_registro,
                livro: f.livro,
                folha: f.folha,
                registro_civil_id: f.registro_civil_id,
                registro_civil_termo_matricula: f.registro_civil_termo_matricula,
                registro_civil_cartorio: f.registro_civil_cartorio,
                registro_civil_livro: f.registro_civil_livro,
                registro_civil_folha: f.registro_civil_folha,
                registro_civil_cidade_id: f.registro_civil_cidade_id,
                registro_civil_emissao: f.registro_civil_emissao
              },

              Banco_de_Horas: {
                banco_horas_utilizacao_id: f.banco_horas_utilizacao_id,
                banco_horas_configuracao_id: f.banco_horas_configuracao_id,
                banco_horas_data_inicio: f.banco_horas_data_inicio
              },

              Dados_Estrangeiro: {
                eh_estrangeiro: f.eh_estrangeiro,
                pais_nacionalidade_id: f.pais_nacionalidade_id,
                estrangeiro_endereco_pais_id: f.estrangeiro_endereco_pais_id,
                estrangeiro_endereco: f.estrangeiro_endereco,
                estrangeiro_endereco_numero: f.estrangeiro_endereco_numero,
                estrangeiro_complemento: f.estrangeiro_complemento,
                estrangeiro_endereco_bairro: f.estrangeiro_endereco_bairro,
                estrangeiro_endereco_cidade: f.estrangeiro_endereco_cidade,
                estrangeiro_endereco_cod_postal: f.estrangeiro_endereco_cod_postal,
                estrangeiro_data_chegada_brasil: f.estrangeiro_data_chegada_brasil,
                estrangeiro_casado_com_brasileiro: f.estrangeiro_casado_com_brasileiro,
                estrangeiro_com_filho_brasileiro: f.estrangeiro_com_filho_brasileiro,
                estrangeirocondicaoingresso: f.estrangeirocondicaoingresso,
                estrangeiro_tipo_residencia: f.estrangeiro_tipo_residencia,
                rne_numero: f.rne_numero,
                rne_orgao_emissor: f.rne_orgao_emissor,
                rne_emissao: f.rne_emissao
              },

              Deficiencias_PCD: {
                deficiencia_id: f.deficiencia_id,
                deficiencia_cota: f.deficiencia_cota,
                deficiencia_fisica: f.deficiencia_fisica,
                deficiencia_auditiva: f.deficiencia_auditiva,
                deficiencia_visual: f.deficiencia_visual,
                deficiencia_intelectual: f.deficiencia_intelectual,
                deficiencia_mental: f.deficiencia_mental,
                deficiencia_reabilitado: f.deficiencia_reabilitado,
                deficiencia_observacao: f.deficiencia_observacao
              },

              Logs_Auditoria_e_Arquivos: {
                log_cadastro_data: f.log_cadastro_data,
                log_cadastro_usuario_id: f.log_cadastro_usuario_id,
                log_alterado_data: f.log_alterado_data,
                log_alterado_usuario_id: f.log_alterado_usuario_id,
                log_liberacao_data: f.log_liberacao_data,
                log_sincronizacao_data: f.log_sincronizacao_data,
                log_integracao_data: f.log_integracao_data,
                rg_arquivo: f.rg_arquivo,
                cpf_arquivo: f.cpf_arquivo,
                pis_arquivo: f.pis_arquivo,
                carteira_trabalho_arquivo: f.carteira_trabalho_arquivo,
                observacao: f.observacao
              }
            };
          });

          // Salva o JSON estruturado na resposta original do Bruno
          body.retorno = retornoAgrupado;
          res.setBody(body);

          // -----------------------------------------------------------
          // 3. Métricas rápidas para o cabeçalho do painel
          // -----------------------------------------------------------
          const totalFuncionarios = retornoAgrupado.length;
          const totalAtivos = countBy(retornoAgrupado, (f) => !!f.cadastro_ativo);
          const totalInativos = totalFuncionarios - totalAtivos;

          // -----------------------------------------------------------
          // 4. Monta os cards (accordions) de cada funcionário
          // -----------------------------------------------------------
          const groupSections = [
            ['Dados Pessoais', 'Informacoes_Pessoais_e_Contato'],
            ['Endereço Residencial', 'Endereco'],
            ['Documentação', 'Documentos'],
            ['Família e Cônjuge', 'Familiar_e_Conjuge'],
            ['Estrutura Contratual', 'Dados_Contratuais_e_Organizacao'],
            ['Financeiro e Jornada', 'Financeiro_Jornada_e_Experiencia'],
            ['Adicionais e Incidências', 'Adicionais_e_Incidencias'],
            ['Dados Bancários', 'Dados_Bancarios_e_Pagamento'],
            ['Benefícios e Vales', 'Beneficios'],
            ['FGTS e Registros Legais', 'FGTS_e_Registros_Legais'],
            ['Banco de Horas', 'Banco_de_Horas'],
            ['Dados de Estrangeiro', 'Dados_Estrangeiro'],
            ['Deficiências / PCD', 'Deficiencias_PCD'],
            ['Logs e Auditoria', 'Logs_Auditoria_e_Arquivos']
          ];

          const funcionarioCards = retornoAgrupado
            .map((f, idx) => {
              const groupsHtml = groupSections
                .map(([titulo, key]) => {
                  return `
                    <div class="group-box">
                      <div class="group-title">${titulo}</div>
                      <table class="data-table">${renderTableRows(f[key])}</table>
                    </div>`;
                })
                .join('');

              const nomeBusca = `${f.nome || ''} ${f.funcionario_contribuinte_id || ''} ${f.cpf || ''}`.toLowerCase();

              return `
                <details class="func-accordion" data-search="${nomeBusca}" data-idx="${idx}">
                  <summary class="func-summary">
                    <div class="func-summary-main">
                      <span class="func-nome">${f.nome || 'Nome não informado'}</span>
                      <span class="func-id">ID ${f.funcionario_contribuinte_id ?? '—'}</span>
                    </div>
                    <div class="func-actions">
                      <button class="action-btn" title="Copiar body agrupado para colar na aba Body do PUT" onclick="copiarParaPut(event, ${idx})">Copiar p/ PUT</button>
                      <button class="action-btn action-btn-danger" title="Copiar empresa_id + funcionario_contribuinte_id para colar na aba Body do DELETE" onclick="copiarParaDelete(event, ${idx})">Copiar p/ DELETE</button>
                    </div>
                    <div class="func-badges">
                      <span class="badge ${f.cadastro_ativo ? 'badge-ativo' : 'badge-inativo'}">${f.cadastro_ativo ? 'Ativo' : 'Inativo'}</span>
                      <span class="badge badge-info">${f.situacao ? String(f.situacao).replace(/_/g, ' ') : '—'}</span>
                    </div>
                  </summary>
                  <div class="inner-content">
                    <div class="group-box">
                      <div class="group-title">Controle Geral</div>
                      <table class="data-table">
                        <tr><td class="prop-name">empresa_id</td><td class="prop-value">${renderVal(f.empresa_id)}</td></tr>
                        <tr><td class="prop-name">v_funcionario_contribuinte_id</td><td class="prop-value">${renderVal(f.v_funcionario_contribuinte_id)}</td></tr>
                        <tr><td class="prop-name">id_admissao_preliminar</td><td class="prop-value">${renderVal(f.id_admissao_preliminar)}</td></tr>
                        <tr><td class="prop-name">v_id_admissao_preliminar</td><td class="prop-value">${renderVal(f.v_id_admissao_preliminar)}</td></tr>
                        <tr><td class="prop-name">tipo</td><td class="prop-value">${renderVal(f.tipo)}</td></tr>
                        <tr><td class="prop-name">nome_social</td><td class="prop-value">${renderVal(f.nome_social)}</td></tr>
                      </table>
                    </div>
                    ${groupsHtml}
                  </div>
                </details>`;
            })
            .join('');

          // -----------------------------------------------------------
          // 5. HTML final do painel (bru.visualize)
          // -----------------------------------------------------------
          const html = `
            <!DOCTYPE html>
            <html lang="pt-BR">
            <head>
            <meta charset="utf-8">
            <style>
              :root {
                --bg: #f5f6f8;
                --surface: #ffffff;
                --surface-alt: #fafbfc;
                --border: #e2e5eb;
                --text: #1f2430;
                --text-muted: #6b7280;
                --primary: #4f46e5;
                --primary-soft: #eef0ff;
                --green: #059669;
                --green-soft: #ecfdf5;
                --red: #dc2626;
                --red-soft: #fef2f2;
                --radius: 10px;
                --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
              }
              * { box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 20px;
                font-size: 14px;
              }

              /* Header */
              .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
              .header h2 { margin: 0; font-size: 19px; font-weight: 700; }
              .stats { display: flex; gap: 8px; flex-wrap: wrap; }
              .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
              .stat-pill b { color: var(--text); }
              .stat-pill.stat-green b { color: var(--green); }
              .stat-pill.stat-red b { color: var(--red); }

              /* Tabs */
              .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
              .tab-button { background: transparent; color: var(--text-muted); border: none; padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; border-bottom: 2px solid transparent; }
              .tab-button:hover { color: var(--text); }
              .tab-button.active { color: var(--primary); border-bottom-color: var(--primary); }
              .tab-content { display: none; }
              .tab-content.active { display: block; }

              /* Toolbar */
              .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
              .search-input { flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; color: var(--text); }
              .search-input:focus { outline: none; border-color: var(--primary); }
              .toolbar-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
              .toolbar-btn:hover { background: var(--surface-alt); color: var(--text); }

              /* Accordion */
              .func-accordion { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
              .func-summary { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; list-style: none; }
              .func-summary::-webkit-details-marker { display: none; }
              .func-summary:hover { background: var(--surface-alt); }
              .func-summary-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
              .func-nome { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .func-id { font-size: 12px; color: var(--text-muted); }
              .func-actions { display: flex; gap: 6px; flex-shrink: 0; }
              .action-btn { background: var(--primary-soft); color: var(--primary); border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
              .action-btn:hover { filter: brightness(0.95); }
              .action-btn-danger { background: var(--red-soft); color: var(--red); }
              .action-btn.copied { background: var(--green-soft); color: var(--green); }
              .func-badges { display: flex; gap: 6px; flex-shrink: 0; }
              .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
              .badge-ativo { background: var(--green-soft); color: var(--green); }
              .badge-inativo { background: var(--red-soft); color: var(--red); }
              .badge-info { background: var(--primary-soft); color: var(--primary); }

              .inner-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px; background: var(--surface-alt); border-top: 1px solid var(--border); }
              .group-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
              .group-title { font-size: 11.5px; color: var(--primary); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
              .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
              .data-table tr { border-bottom: 1px solid var(--border); }
              .data-table tr:last-child { border-bottom: none; }
              .data-table td { padding: 5px 2px; vertical-align: top; }
              .prop-name { color: var(--text-muted); width: 48%; }
              .prop-value { color: var(--text); text-align: right; width: 52%; word-break: break-word; font-weight: 500; }
              .val-null { color: #a1a5b0; font-style: italic; font-weight: 400; }
              .val-bool.true { color: var(--green); font-weight: 700; }
              .val-bool.false { color: var(--red); font-weight: 700; }

              /* Raw JSON */
              .json-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
              pre { background: #1e1e24; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; color: #a5d6a7; font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.55; margin: 0; }

              .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px; }
            </style>
            </head>
            <body>

              <div class="header">
                <h2>Painel de Admissões</h2>
                <div class="stats">
                  <span class="stat-pill">Total <b>${totalFuncionarios}</b></span>
                  <span class="stat-pill stat-green">Ativos <b>${totalAtivos}</b></span>
                  <span class="stat-pill stat-red">Inativos <b>${totalInativos}</b></span>
                </div>
              </div>

              <div class="tabs">
                <button class="tab-button active" onclick="switchTab(event, 'visual-panel')">Painel Visual</button>
                <button class="tab-button" onclick="switchTab(event, 'raw-json')">JSON Original</button>
              </div>

              <div id="visual-panel" class="tab-content active">
                <div class="toolbar">
                  <input type="text" class="search-input" id="searchInput" placeholder="Buscar por nome, ID ou CPF..." oninput="filterFuncionarios()">
                  <button class="toolbar-btn" onclick="toggleAll(true)">Expandir tudo</button>
                  <button class="toolbar-btn" onclick="toggleAll(false)">Recolher tudo</button>
                </div>
                <div id="cardsContainer">
                  ${funcionarioCards || '<div class="empty-state">Nenhum funcionário encontrado no retorno.</div>'}
                </div>
                <div id="noResults" class="empty-state" style="display:none;">Nenhum resultado para essa busca.</div>
              </div>

              <div id="raw-json" class="tab-content">
                <div class="json-toolbar">
                  <button class="toolbar-btn" onclick="copyJson()">Copiar JSON</button>
                </div>
                <pre id="jsonRaw"><code>${JSON.stringify(jsonOriginal, null, 2)}</code></pre>
              </div>

              <script>
                // Dados de cada funcionário (mesma estrutura agrupada usada no
                // painel), embutidos aqui para os botões "Copiar p/ PUT/DELETE"
                // funcionarem sem precisar reconsultar a API.
                const dadosFuncionarios = ${JSON.stringify(retornoAgrupado)};

                function switchTab(evt, tabId) {
                  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                  document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
                  document.getElementById(tabId).classList.add('active');
                  evt.currentTarget.classList.add('active');
                }

                function toggleAll(open) {
                  document.querySelectorAll('.func-accordion').forEach(el => { el.open = open; });
                }

                function filterFuncionarios() {
                  const term = document.getElementById('searchInput').value.trim().toLowerCase();
                  const cards = document.querySelectorAll('.func-accordion');
                  let visibleCount = 0;
                  cards.forEach(card => {
                    const matches = card.dataset.search.includes(term);
                    card.style.display = matches ? '' : 'none';
                    if (matches) visibleCount++;
                  });
                  document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
                }

                function copyJson() {
                  const text = document.getElementById('jsonRaw').innerText;
                  navigator.clipboard.writeText(text).then(() => {
                    const btn = event.currentTarget;
                    const original = btn.innerText;
                    btn.innerText = 'Copiado!';
                    setTimeout(() => { btn.innerText = original; }, 1500);
                  });
                }

                function feedbackBotao(btn) {
                  const original = btn.innerText;
                  btn.innerText = 'Copiado!';
                  btn.classList.add('copied');
                  setTimeout(() => {
                    btn.innerText = original;
                    btn.classList.remove('copied');
                  }, 1500);
                }

                // Copia o registro inteiro, já agrupado, pronto para colar
                // direto na aba Body da requisição de PUT.
                // Logs_Auditoria_e_Arquivos vai sempre null: são campos de
                // controle interno da API, que não aceitam alteração via PUT.
                function copiarParaPut(evt, idx) {
                  evt.preventDefault();
                  evt.stopPropagation();
                  const funcionario = JSON.parse(JSON.stringify(dadosFuncionarios[idx]));
                  if (funcionario.Logs_Auditoria_e_Arquivos) {
                    Object.keys(funcionario.Logs_Auditoria_e_Arquivos).forEach((key) => {
                      funcionario.Logs_Auditoria_e_Arquivos[key] = null;
                    });
                  }
                  navigator.clipboard.writeText(JSON.stringify(funcionario, null, 2)).then(() => {
                    feedbackBotao(evt.currentTarget);
                  });
                }

                // Copia só empresa_id + funcionario_contribuinte_id, pronto
                // para colar na aba Body da requisição de DELETE.
                function copiarParaDelete(evt, idx) {
                  evt.preventDefault();
                  evt.stopPropagation();
                  const funcionario = dadosFuncionarios[idx];
                  const payload = {
                    empresa_id: funcionario.empresa_id,
                    funcionario_contribuinte_id: funcionario.funcionario_contribuinte_id
                  };
                  navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
                    feedbackBotao(evt.currentTarget);
                  });
                }
              </script>
            </body>
            </html>
          `;

          // Executa o motor nativo do Bruno para gerar o painel Visualizer
          bru.visualize('html', {
            name: 'Lista de Funcionários',
            content: html
          });
        }

