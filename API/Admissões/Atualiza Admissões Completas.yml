runtime:
  scripts:
    - type: before-request
      code: |-
        // =============================================================
        // PRE-REQUEST SCRIPT - BRUNO (atualização / PUT)
        // Lê o body agrupado por seções lógicas (aba Body) e "achata"
        // para o formato plano que a API espera no envio real.
        // Mesma lógica usada no POST — o achatamento não depende do verbo.
        // =============================================================

        const bodyAgrupado = req.getBody();

        if (bodyAgrupado && typeof bodyAgrupado === 'object' && !Array.isArray(bodyAgrupado)) {
          const bodyPlano = {};

          Object.keys(bodyAgrupado).forEach((key) => {
            const valor = bodyAgrupado[key];
            const ehGrupo = valor && typeof valor === 'object' && !Array.isArray(valor);

            if (ehGrupo) {
              // Grupo lógico (ex: Informacoes_Pessoais_e_Contato) -> joga os filhos pra raiz
              Object.assign(bodyPlano, valor);
            } else {
              // Campo solto na raiz (ex: nome, empresa_id) -> mantém como está
              bodyPlano[key] = valor;
            }
          });

          // O PUT precisa do funcionario_contribuinte_id para saber qual
          // registro atualizar. Esse ID é gerado no POST (auto-increment),
          // então: se não foi digitado manualmente no Body, usa o valor
          // salvo pelo post-response do POST/PUT anterior (bru.setVar).
          const idConhecido = bru.getVar('funcionario_contribuinte_id');
          const idDigitadoNoBody = bodyPlano.funcionario_contribuinte_id;

          if (!idDigitadoNoBody) {
            if (idConhecido) {
              bodyPlano.funcionario_contribuinte_id = idConhecido;
            }
          } else if (idConhecido && String(idDigitadoNoBody) !== String(idConhecido)) {
            // Rede de segurança: o Body tem um ID diferente do último
            // criado/atualizado. Pode ser intencional (você escolheu editar
            // outro funcionário via "Copiar p/ PUT") ou pode ser um ID
            // esquecido de um teste anterior — nos dois casos, avisa.
            console.warn(
              `[PUT] Atenção: funcionario_contribuinte_id do Body (${idDigitadoNoBody}) é diferente do último ` +
              `registro criado/atualizado (${idConhecido}). Confirme se é o funcionário certo antes de enviar.`
            );
            bru.setVar('avisoIdDivergente', JSON.stringify({
              idBody: idDigitadoNoBody,
              idConhecido: idConhecido
            }));
          }

          if (!bodyPlano.funcionario_contribuinte_id) {
            console.warn('[PUT] Nenhum funcionario_contribuinte_id disponível (nem no Body, nem salvo de um POST/PUT anterior).');
          }

          // Limpa o aviso de divergência de execuções anteriores, caso não
          // se aplique mais nesta requisição.
          if (!idDigitadoNoBody || !idConhecido || String(idDigitadoNoBody) === String(idConhecido)) {
            bru.setVar('avisoIdDivergente', '');
          }

          // Reordena para empresa_id -> funcionario_contribuinte_id -> resto,
          // só para ficar legível no console/log do Bruno.
          const bodyPlanoOrdenado = {};
          if (Object.prototype.hasOwnProperty.call(bodyPlano, 'empresa_id')) {
            bodyPlanoOrdenado.empresa_id = bodyPlano.empresa_id;
          }
          if (Object.prototype.hasOwnProperty.call(bodyPlano, 'funcionario_contribuinte_id')) {
            bodyPlanoOrdenado.funcionario_contribuinte_id = bodyPlano.funcionario_contribuinte_id;
          }
          Object.keys(bodyPlano).forEach((key) => {
            if (key !== 'empresa_id' && key !== 'funcionario_contribuinte_id') {
              bodyPlanoOrdenado[key] = bodyPlano[key];
            }
          });

          // Guarda o body agrupado original em uma variável de requisição.
          // Isso permite reconstruir a visão organizada no post-response,
          // já que o retorno da API normalmente vem achatado também,
          // e também permite mostrar "o que foi enviado" no painel visual.
          bru.setVar('bodyAgrupadoOriginal', JSON.stringify(bodyAgrupado));
          bru.setVar('bodyPlanoEnviado', JSON.stringify(bodyPlanoOrdenado));

          req.setBody(bodyPlanoOrdenado);
        }
    - type: after-response
      code: |-
        // =============================================================
        // POST-RESPONSE SCRIPT - BRUNO (atualização / PUT)
        // Mesmo padrão do GET e do POST: agrupa o retorno da API em
        // seções lógicas, salva com res.setBody() e gera um painel
        // visual (bru.visualize). Resposta é um único registro (não lista).
        // =============================================================

        // -------------------------------------------------------------
        // Helpers (const/arrow no topo do script)
        // -------------------------------------------------------------
        const renderVal = (val) => {
          if (val === null || val === undefined) return '<span class="val-null">null</span>';
          if (typeof val === 'boolean') return `<span class="val-bool ${val ? 'true' : 'false'}">${val ? 'true' : 'false'}</span>`;
          if (val === '') return '<span class="val-null">vazio</span>';
          return String(val);
        };

        const renderTableRows = (obj) => {
          if (!obj) return '';
          return Object.keys(obj)
            .map((key) => `<tr><td class="prop-name">${key}</td><td class="prop-value">${renderVal(obj[key])}</td></tr>`)
            .join('');
        };

        // -------------------------------------------------------------
        // 1. Salva cópia do JSON original antes de qualquer alteração
        // -------------------------------------------------------------
        const jsonOriginal = JSON.parse(JSON.stringify(res.getBody()));
        const body = res.getBody();

        // A API embrulha o registro dentro de "retorno", junto com
        // sucesso/status/mensagem. É de lá que os dados reais vêm.
        if (body && body.retorno) {
          const f = body.retorno;

