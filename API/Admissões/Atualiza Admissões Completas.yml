docs: |-
  Substitui todos os dados de um funcionário ou contribuinte existente (PUT). O recurso é completamente substituído pelos dados enviados. Campos ausentes na requisição serão definidos como null no banco de dados. ATENÇÃO: Envie sempre o recurso completo para evitar perda de dados.
   * **Campos não suportados neste endpoint (serão ignorados se enviados):**
   * - `quadro_horario_id`: para alterar o quadro de horário utilize o endpoint específico de alteração de quadro de horário.
   *
   * **Informações relevantes:**
   * - funcionario_contribuinte_id: identifica o registro a ser atualizado. O campo é obrigatório e deve corresponder a um registro existente. Se o ID não for encontrado, o sistema retornará erro de validação.
   * - v_funcionario_contribuinte_id: código do funcionário/contribuinte no sistema de origem. É obrigatório e não pode ser vazio - caso seja enviado como null ou omitido, o sistema retornará erro de validação.
   * - empresa_id: deve corresponder ao ID da empresa associada ao registro. Se a empresa_id for diferente da empresa associada ao funcionario_contribuinte_id, o sistema retornará erro de validação.
   * - tipo: NÃO PODERÁ SER ALTERADO. Uma vez cadastrado, o tipo do funcionário ou contribuinte não pode ser modificado. Caso seja mandado na requisição o campo tipo diferente do valor atual, o sistema IRÁ retornar erro de validação.
   * - cpf: será validado no formato XXX.XXX.XXX-XX com pontuação.
