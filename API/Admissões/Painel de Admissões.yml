        ['Adicionais e Incidências', ['insalubridade_adicional', 'insalubridade_incidencia_id', 'periculosidade_adicional', 'periculosidade_incidencia_id', 'noturno_adicional', 'noturno_incidencia_id', 'valor_previdencia_privada', 'valor_previdencia_privada13']],
        ['Dados Bancários', ['banco_id', 'banco_conta_agencia', 'banco_conta', 'banco_conta_digito', 'banco_conta_tipo_id', 'banco_modo_pagamento', 'recebe_adiantamento', 'percentual_adiantamento', 'cartao_salario']],
        ['Benefícios e Vales', ['recebe_vale_refeicao', 'cartao_vr', 'recebe_vale_alimentacao', 'cartao_va', 'recebe_vale_transporte', 'cartao_vt']],
        ['FGTS e Registros Legais', ['fgts_conta', 'fgts_ocorrencia_id', 'cartao_ponto', 'ficha_registro', 'livro', 'folha', 'registro_civil_id', 'registro_civil_termo_matricula', 'registro_civil_cartorio', 'registro_civil_livro', 'registro_civil_folha', 'registro_civil_cidade_id', 'registro_civil_emissao']],
        ['Banco de Horas', ['banco_horas_utilizacao_id', 'banco_horas_configuracao_id', 'banco_horas_data_inicio']],
        ['Dados de Estrangeiro', ['eh_estrangeiro', 'pais_nacionalidade_id', 'estrangeiro_endereco_pais_id', 'estrangeiro_endereco', 'estrangeiro_endereco_numero', 'estrangeiro_complemento', 'estrangeiro_endereco_bairro', 'estrangeiro_endereco_cidade', 'estrangeiro_endereco_cod_postal', 'estrangeiro_data_chegada_brasil', 'estrangeiro_casado_com_brasileiro', 'estrangeiro_com_filho_brasileiro', 'estrangeirocondicaoingresso', 'estrangeiro_tipo_residencia', 'rne_numero', 'rne_orgao_emissor', 'rne_emissao']],
        ['Deficiências / PCD', ['deficiencia_id', 'deficiencia_cota', 'deficiencia_fisica', 'deficiencia_auditiva', 'deficiencia_visual', 'deficiencia_intelectual', 'deficiencia_mental', 'deficiencia_reabilitado', 'deficiencia_observacao']],
        ['Logs e Auditoria (somente leitura)', ['log_cadastro_data', 'log_cadastro_usuario_id', 'log_alterado_data', 'log_alterado_usuario_id', 'log_liberacao_data', 'log_sincronizacao_data', 'log_integracao_data', 'rg_arquivo', 'cpf_arquivo', 'pis_arquivo', 'carteira_trabalho_arquivo', 'observacao']],
        ];

        const SCHEMA_PRELIMINAR_FORM = [
          ['Dados do Registro', ['id', 'empresa_id', 'v_id', 'tipo_colaborador', 'tipo_admissao', 'classe_id', 'nome',
            'matricula_anterior', 'nascimento_data', 'admissao_data', 'cpf', 'pis', 'numero_recibo', 'data_integracao',
            'preenchimento_dados_cadastrais', 'email', 'matricula_esocial', 'categoria_esocial_id', 'funcao_id', 'tipo',
            'salario', 'contrato_tipo_id', 'prazo_experiencia', 'fim_prazo_experiencia', 'funcionario_contribuinte_id']],
        ];
        const SCHEMA_PRELIMINAR_DISPLAY = [
          ['Dados do Registro', ['id', 'empresa_id', 'v_id', 'tipo_colaborador', 'tipo_admissao', 'classe_id',
            'matricula_anterior', 'nascimento_data', 'admissao_data', 'cpf', 'pis', 'numero_recibo', 'data_integracao',
            'preenchimento_dados_cadastrais', 'email', 'matricula_esocial', 'categoria_esocial_id', 'funcao_id', 'tipo',
            'salario', 'contrato_tipo_id', 'prazo_experiencia', 'fim_prazo_experiencia', 'funcionario_contribuinte_id']],
          ['Auditoria (somente leitura)', ['log_cadastro_data', 'log_alterado_data']],
        ];

        // Campos que viram <select> em vez de <input> no formulário de completa
        const SELECTS_COMPLETA = {
          tipo: ['', 'funcionario', 'contribuinte'],
          situacao: ['', 'integrado', 'liberado', 'nao_liberado', 'aguardando_integracao', 'recusado'],
          cadastro_ativo: ['', 'true', 'false'],
        };

        // =============================================================
        // Helpers genéricos
        // =============================================================
        const v = (id) => (document.getElementById(id)?.value ?? '');

        const renderVal = (val) => {
          if (val === null || val === undefined || val === '') return '<span class="val-null">—</span>';
          if (typeof val === 'boolean') return val ? 'true' : 'false';
          return String(val);
        };

        function mostrarErro(boxId, msg, ok) {
          const box = document.getElementById(boxId);
          if (!msg) { box.innerHTML = ''; return; }
          box.innerHTML = `<div class="${ok ? 'pf-sucesso' : 'pf-error'}">${msg}</div>`;
        }

        function mostrarDebug(obj) {
          try {
            document.getElementById('pfDebugRaw').innerHTML = '<code>' + JSON.stringify(obj, null, 2) + '</code>';
          } catch (e) {
            document.getElementById('pfDebugRaw').innerHTML = '<code>' + String(obj) + '</code>';
          }
        }

        function montarQueryString(pares) {
          return pares
            .filter(([, val]) => (val ?? '').toString().trim() !== '')
            .map(([chave, val]) => `${chave}=${encodeURIComponent(val.toString().trim())}`)
            .join('&');
        }

        function extrairBody(res) { return res?.data ?? res?.body ?? null; }

        function interpretarResposta(res) {
          const status = res?.status;
          const body = extrairBody(res);
          if (status && status >= 400) {
            const msg = (body && body.mensagem) || `A API retornou status ${status}.`;
            const detalhes = (body && body.erros) ? '\n' + JSON.stringify(body.erros, null, 2) : '';
            return { ok: false, status, body, msg: msg + detalhes };
          }
          return { ok: true, status, body, msg: (body && body.mensagem) || '' };
        }

        function toggleAll(containerId, open) {
          document.querySelectorAll(`#${containerId} .func-accordion`).forEach(el => { el.open = open; });
        }

        function filtrarLocal(containerId, inputId) {
          const term = (document.getElementById(inputId).value || '').trim().toLowerCase();
          const cards = document.querySelectorAll(`#${containerId} .func-accordion`);
          cards.forEach(card => {
            card.style.display = card.dataset.search.includes(term) ? '' : 'none';
          });
        }

        function trocarRecurso(nome) {
          document.getElementById('secao-completas').style.display = nome === 'completas' ? '' : 'none';
          document.getElementById('secao-preliminares').style.display = nome === 'preliminares' ? '' : 'none';
          document.querySelectorAll('.ap-resource-tab').forEach(b => b.classList.toggle('active', b.dataset.recurso === nome));
        }
        window.trocarRecurso = trocarRecurso;

        // =============================================================
        // Formulário genérico (usado por completa e preliminar)
        // =============================================================
        function campoHtml(nome, prefixo, valor, selects) {
          const id = `${prefixo}__${nome}`;
          const val = (valor === null || valor === undefined) ? '' : valor;
          if (selects && selects[nome]) {
            const opts = selects[nome].map(o =>
              `<option value="${o}" ${String(val) === o ? 'selected' : ''}>${o || 'Selecione'}</option>`
            ).join('');
            return `<div class="campo"><label>${nome}</label><select id="${id}">${opts}</select></div>`;
          }
          const isDate = /_data$/.test(nome) && !nome.startsWith('log_');
          const type = isDate ? 'date' : 'text';
          const safeVal = String(val).replace(/"/g, '&quot;');
          return `<div class="campo"><label>${nome}</label><input id="${id}" type="${type}" value="${safeVal}"></div>`;
        }

        function renderCampos(schema, prefixo, valores, selects) {
          return schema.map(([titulo, campos]) => `
            <fieldset class="form-fieldset">
              <legend>${titulo}</legend>
              <div class="form-grid">${campos.map(c => campoHtml(c, prefixo, valores[c], selects)).join('')}</div>
            </fieldset>`).join('');
        }

        function coletarCampos(schema, prefixo) {
          const out = {};
          schema.forEach(([, campos]) => campos.forEach(c => {
            out[c] = document.getElementById(`${prefixo}__${c}`)?.value ?? '';
          }));
          return out;
        }

        // =============================================================
        // Orquestração via bru.ctx (Collection App)
        // =============================================================
        let mapaRequests = {};
        let ctxPronto = false;
        let carregandoCompletas = false;
        let carregandoPreliminares = false;
        let dadosCompletas = [];
        let dadosPreliminares = [];
        let modoFormCompleta = null;
        let modoFormPreliminar = null;

        async function chamar(nomeRequest, runtimeVariables) {
          const pathname = mapaRequests[nomeRequest];
          if (!pathname) {
            throw new Error(`Request "${nomeRequest}" não encontrada na coleção. Confira o nome exato em bru.ctx.listRequests() (aba Depuração).`);
          }
          const res = await bru.ctx.runRequest(pathname, { runtimeVariables });
          mostrarDebug({ request: nomeRequest, enviado: runtimeVariables, resposta: res });
          return res;
        }

        function atualizarBotao(btnId, labelId, carregando, jaCarregou, textoInicial) {
          const btn = document.getElementById(btnId);
          const label = document.getElementById(labelId);
          if (!ctxPronto) { btn.disabled = true; label.textContent = 'Inicializando...'; return; }
          if (carregando) { btn.disabled = true; label.innerHTML = '<span class="spinner"></span> Buscando...'; return; }
          btn.disabled = false;
          label.textContent = jaCarregou ? '🔄 Atualizar' : textoInicial;
        }
        const atualizarBotaoCompletas = () => atualizarBotao('btnBuscarCompletas', 'btnBuscarCompletasLabel', carregandoCompletas, dadosCompletas.length > 0, '▶ Buscar dados');
        const atualizarBotaoPreliminares = () => atualizarBotao('btnBuscarPreliminares', 'btnBuscarPreliminaresLabel', carregandoPreliminares, dadosPreliminares.length > 0, '▶ Buscar dados');

        // ---------------- COMPLETAS ----------------

        function limparFiltrosCompletas() {
          ['cEmpresaId','cFuncionarioId','cFuncionarioIdLegado','cTipo','cSituacao','cAlteradoData'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('cPage').value = '1';
        }
        window.limparFiltrosCompletas = limparFiltrosCompletas;

        async function buscarCompletas(resetarPagina) {
          if (!ctxPronto || carregandoCompletas) return;
          if (resetarPagina) document.getElementById('cPage').value = '1';
          mostrarErro('pfErrorBoxCompletas', '');
          carregandoCompletas = true;
          atualizarBotaoCompletas();
          try {
            const rt_query = montarQueryString([
              ['empresa_id', v('cEmpresaId')],
              ['funcionario_contribuinte_id', v('cFuncionarioId')],
              ['v_funcionario_contribuinte_id', v('cFuncionarioIdLegado')],
              ['tipo', v('cTipo')],
              ['situacao', v('cSituacao')],
              ['alterado_data', v('cAlteradoData')],
              ['page', v('cPage') || '1'],
            ]);
            const res = await chamar(REQ.listaCompletas, { rt_query });
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxCompletas', r.msg); dadosCompletas = []; renderCompletas([], null); return; }
            dadosCompletas = Array.isArray(r.body?.retorno) ? r.body.retorno : [];
            renderCompletas(dadosCompletas, r.body?.paginacao || null);
          } catch (err) {
            mostrarErro('pfErrorBoxCompletas', err.message || String(err));
          } finally {
            carregandoCompletas = false;
            atualizarBotaoCompletas();
          }
        }
        window.buscarCompletas = buscarCompletas;

        function irParaPaginaCompletas(n) {
          if (n < 1) return;
          document.getElementById('cPage').value = n;
          buscarCompletas(false);
        }
        window.irParaPaginaCompletas = irParaPaginaCompletas;

        function renderPaginacao(containerId, p, irFn) {
          const box = document.getElementById(containerId);
          if (!p) { box.innerHTML = ''; return; }
          box.innerHTML = `
            <button class="toolbar-btn" ${p.pagina_atual <= 1 ? 'disabled' : ''} onclick="${irFn}(${p.pagina_atual - 1})">← Anterior</button>
            <span>Página ${p.pagina_atual} de ${p.ultima_pagina} · ${p.total} registros (mostrando ${p.inicio}–${p.fim})</span>
            <button class="toolbar-btn" ${p.pagina_atual >= p.ultima_pagina ? 'disabled' : ''} onclick="${irFn}(${p.pagina_atual + 1})">Próxima →</button>
          `;
        }

        function montarCardCompleta(f, idx) {
          const groupsHtml = SCHEMA_COMPLETA_DISPLAY.map(([titulo, campos]) => `
            <div class="group-box"><div class="group-title">${titulo}</div>
              <table class="data-table">${campos.map(c => `<tr><td class="prop-name">${c}</td><td class="prop-value">${renderVal(f[c])}</td></tr>`).join('')}</table>
            </div>`).join('');
          const nomeBusca = `${f.nome || ''} ${f.funcionario_contribuinte_id || ''} ${f.cpf || ''}`.toLowerCase();
          return `
            <details class="func-accordion" data-search="${nomeBusca}">
              <summary class="func-summary">
                <div class="func-summary-main">
                  <span class="func-nome">${f.nome || 'Nome não informado'}</span>
                  <span class="func-id">ID ${f.funcionario_contribuinte_id ?? '—'}</span>
                </div>
                <div class="func-actions">
                  <button class="action-btn" onclick="event.preventDefault();event.stopPropagation();abrirFormCompleta('editar', ${idx})">Editar</button>
                  <button class="action-btn action-btn-danger" onclick="event.preventDefault();event.stopPropagation();excluirCompleta(${idx})">Excluir</button>
                </div>
                <div class="func-badges">
                  <span class="badge ${f.cadastro_ativo ? 'badge-ativo' : 'badge-inativo'}">${f.cadastro_ativo ? 'Ativo' : 'Inativo'}</span>
                  <span class="badge badge-info">${f.situacao ? String(f.situacao).replace(/_/g, ' ') : '—'}</span>
                </div>
              </summary>
              <div class="inner-content">${groupsHtml}</div>
            </details>`;
        }

        function renderCompletas(lista, paginacao) {
          const total = paginacao ? paginacao.total : lista.length;
          const ativos = lista.reduce((n, f) => n + (f.cadastro_ativo ? 1 : 0), 0);
          document.getElementById('cTotal').textContent = total;
          document.getElementById('cAtivos').textContent = ativos;
          document.getElementById('cInativos').textContent = lista.length - ativos;
          document.getElementById('cardsContainerCompletas').innerHTML =
            lista.map(montarCardCompleta).join('') || '<div class="empty-state">Nenhum registro encontrado com esses filtros.</div>';
          renderPaginacao('pfPaginacaoCompletas', paginacao, 'irParaPaginaCompletas');
        }

        function abrirFormCompleta(modo, idx) {
          modoFormCompleta = modo;
          const registro = modo === 'editar' ? dadosCompletas[idx] : {};
          const valores = modo === 'editar' ? registro : { empresa_id: v('cEmpresaId') || '900002', tipo: 'funcionario', cadastro_ativo: 'true' };
          const html = `
            <div class="form-panel">
              <div class="form-panel-header">
                <h3>${modo === 'criar' ? '+ Nova admissão completa' : `Editar: ${registro.nome || registro.funcionario_contribuinte_id}`}</h3>
                <button class="toolbar-btn" onclick="fecharFormCompleta()">Fechar</button>
              </div>
              ${renderCampos(SCHEMA_COMPLETA_FORM, 'cf', valores, SELECTS_COMPLETA)}
              <div class="form-panel-actions">
                <button class="btn-refresh" onclick="salvarCompleta()">${modo === 'criar' ? 'Criar' : 'Salvar alterações'}</button>
                <button class="toolbar-btn" onclick="fecharFormCompleta()">Cancelar</button>
              </div>
            </div>`;
          document.getElementById('formCompletasContainer').innerHTML = html;
          document.getElementById('formCompletasContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        window.abrirFormCompleta = abrirFormCompleta;

        function fecharFormCompleta() {
          modoFormCompleta = null;
          document.getElementById('formCompletasContainer').innerHTML = '';
        }
        window.fecharFormCompleta = fecharFormCompleta;

        async function salvarCompleta() {
          const dados = coletarCampos(SCHEMA_COMPLETA_FORM, 'cf');
          const nomeRequest = modoFormCompleta === 'criar' ? REQ.criaCompleta : REQ.atualizaCompleta;
          mostrarErro('pfErrorBoxCompletas', '');
          try {
            const res = await chamar(nomeRequest, dados);
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxCompletas', r.msg); return; }
            mostrarErro('pfErrorBoxCompletas', modoFormCompleta === 'criar' ? 'Registro criado com sucesso.' : 'Registro atualizado com sucesso.', true);
            fecharFormCompleta();
            buscarCompletas(false);
          } catch (err) {
            mostrarErro('pfErrorBoxCompletas', err.message || String(err));
          }
        }
        window.salvarCompleta = salvarCompleta;

        async function excluirCompleta(idx) {
          const f = dadosCompletas[idx];
          if (!confirm(`Excluir o registro de "${f.nome || f.funcionario_contribuinte_id}"? Essa ação não pode ser desfeita.`)) return;
          mostrarErro('pfErrorBoxCompletas', '');
          try {
            const res = await chamar(REQ.removeCompleta, {
              empresa_id: String(f.empresa_id ?? ''),
              funcionario_contribuinte_id: String(f.funcionario_contribuinte_id ?? ''),
            });
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxCompletas', r.msg); return; }
            mostrarErro('pfErrorBoxCompletas', 'Registro excluído com sucesso.', true);
            buscarCompletas(false);
          } catch (err) {
            mostrarErro('pfErrorBoxCompletas', err.message || String(err));
          }
        }
        window.excluirCompleta = excluirCompleta;

        // ---------------- PRELIMINARES ----------------

        function limparFiltrosPreliminares() {
          ['pEmpresaId','pId','pSituacao','pAlteradoData'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('pPage').value = '1';
        }
        window.limparFiltrosPreliminares = limparFiltrosPreliminares;

        async function buscarPreliminares(resetarPagina) {
          if (!ctxPronto || carregandoPreliminares) return;
          if (resetarPagina) document.getElementById('pPage').value = '1';
          mostrarErro('pfErrorBoxPreliminares', '');
          carregandoPreliminares = true;
          atualizarBotaoPreliminares();
          try {
            const rt_query = montarQueryString([
              ['empresa_id', v('pEmpresaId')],
              ['id', v('pId')],
              ['situacao', v('pSituacao')],
              ['alterado_data', v('pAlteradoData')],
              ['page', v('pPage') || '1'],
            ]);
            const res = await chamar(REQ.listaPreliminares, { rt_query });
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxPreliminares', r.msg); dadosPreliminares = []; renderPreliminares([], null); return; }
            dadosPreliminares = Array.isArray(r.body?.retorno) ? r.body.retorno : [];
            renderPreliminares(dadosPreliminares, r.body?.paginacao || null);
          } catch (err) {
            mostrarErro('pfErrorBoxPreliminares', err.message || String(err));
          } finally {
            carregandoPreliminares = false;
            atualizarBotaoPreliminares();
          }
        }
        window.buscarPreliminares = buscarPreliminares;

        function irParaPaginaPreliminares(n) {
          if (n < 1) return;
          document.getElementById('pPage').value = n;
          buscarPreliminares(false);
        }
        window.irParaPaginaPreliminares = irParaPaginaPreliminares;

        function montarCardPreliminar(f, idx) {
          const groupsHtml = SCHEMA_PRELIMINAR_DISPLAY.map(([titulo, campos]) => `
            <div class="group-box"><div class="group-title">${titulo}</div>
              <table class="data-table">${campos.map(c => `<tr><td class="prop-name">${c}</td><td class="prop-value">${renderVal(f[c])}</td></tr>`).join('')}</table>
            </div>`).join('');
          const nomeBusca = `${f.nome || ''} ${f.id || ''} ${f.cpf || ''}`.toLowerCase();
          return `
            <details class="func-accordion" data-search="${nomeBusca}">
              <summary class="func-summary">
                <div class="func-summary-main">
                  <span class="func-nome">${f.nome || 'Nome não informado'}</span>
                  <span class="func-id">ID ${f.id ?? '—'}</span>
                </div>
                <div class="func-actions">
                  <button class="action-btn" onclick="event.preventDefault();event.stopPropagation();abrirFormPreliminar('editar', ${idx})">Editar</button>
                  <button class="action-btn action-btn-danger" onclick="event.preventDefault();event.stopPropagation();excluirPreliminar(${idx})">Excluir</button>
                </div>
              </summary>
              <div class="inner-content">${groupsHtml}</div>
            </details>`;
        }

        function renderPreliminares(lista, paginacao) {
          document.getElementById('pTotal').textContent = paginacao ? paginacao.total : lista.length;
          document.getElementById('cardsContainerPreliminares').innerHTML =
            lista.map(montarCardPreliminar).join('') || '<div class="empty-state">Nenhum registro encontrado com esses filtros.</div>';
          renderPaginacao('pfPaginacaoPreliminares', paginacao, 'irParaPaginaPreliminares');
        }

        function abrirFormPreliminar(modo, idx) {
          modoFormPreliminar = modo;
          const registro = modo === 'editar' ? dadosPreliminares[idx] : {};
          const valores = modo === 'editar' ? registro : { empresa_id: v('pEmpresaId') || '900002' };
          const html = `
            <div class="form-panel">
              <div class="form-panel-header">
                <h3>${modo === 'criar' ? '+ Nova admissão preliminar' : `Editar: ${registro.nome || registro.id}`}</h3>
                <button class="toolbar-btn" onclick="fecharFormPreliminar()">Fechar</button>
              </div>
              ${renderCampos(SCHEMA_PRELIMINAR_FORM, 'pf', valores)}
              <div class="form-panel-actions">
                <button class="btn-refresh" onclick="salvarPreliminar()">${modo === 'criar' ? 'Criar' : 'Salvar alterações'}</button>
                <button class="toolbar-btn" onclick="fecharFormPreliminar()">Cancelar</button>
              </div>
            </div>`;
          document.getElementById('formPreliminaresContainer').innerHTML = html;
          document.getElementById('formPreliminaresContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (modo === 'criar') {
            const idInput = document.getElementById('pf__id');
            if (idInput) { idInput.disabled = true; idInput.placeholder = 'gerado automaticamente'; }
          }
        }
        window.abrirFormPreliminar = abrirFormPreliminar;

        function fecharFormPreliminar() {
          modoFormPreliminar = null;
          document.getElementById('formPreliminaresContainer').innerHTML = '';
        }
        window.fecharFormPreliminar = fecharFormPreliminar;

        async function salvarPreliminar() {
          const dados = coletarCampos(SCHEMA_PRELIMINAR_FORM, 'pf');
          const nomeRequest = modoFormPreliminar === 'criar' ? REQ.criaPreliminar : REQ.atualizaPreliminar;
          mostrarErro('pfErrorBoxPreliminares', '');
          try {
            const res = await chamar(nomeRequest, dados);
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxPreliminares', r.msg); return; }
            mostrarErro('pfErrorBoxPreliminares', modoFormPreliminar === 'criar' ? 'Registro criado com sucesso.' : 'Registro atualizado com sucesso.', true);
            fecharFormPreliminar();
            buscarPreliminares(false);
          } catch (err) {
            mostrarErro('pfErrorBoxPreliminares', err.message || String(err));
          }
        }
        window.salvarPreliminar = salvarPreliminar;

        async function excluirPreliminar(idx) {
          const f = dadosPreliminares[idx];
          if (!confirm(`Excluir o registro de "${f.nome || f.id}"? Essa ação não pode ser desfeita.`)) return;
          mostrarErro('pfErrorBoxPreliminares', '');
          try {
            const res = await chamar(REQ.removePreliminar, {
              empresa_id: String(f.empresa_id ?? ''),
              id: String(f.id ?? ''),
            });
            const r = interpretarResposta(res);
            if (!r.ok) { mostrarErro('pfErrorBoxPreliminares', r.msg); return; }
            mostrarErro('pfErrorBoxPreliminares', 'Registro excluído com sucesso.', true);
            buscarPreliminares(false);
          } catch (err) {
            mostrarErro('pfErrorBoxPreliminares', err.message || String(err));
          }
        }
        window.excluirPreliminar = excluirPreliminar;

        // =============================================================
        // Inicialização - bru.ctx chega de forma assíncrona, então tudo
        // que depende dele mora aqui dentro (nunca no topo do script).
        // =============================================================
        bru.ctx.onInit = async () => {
          try {
            const todas = await bru.ctx.listRequests();
            todas.forEach(r => { mapaRequests[r.name] = r.pathname; });
            const faltando = Object.values(REQ).filter(nome => !mapaRequests[nome]);
            document.getElementById('apStatus').textContent = faltando.length
              ? `Atenção: ${faltando.length} request(s) não encontrada(s): ${faltando.join(', ')}`
              : `${todas.length} requests carregadas da coleção.`;
          } catch (err) {
            document.getElementById('apStatus').textContent = 'Erro ao listar requests: ' + (err.message || err);
          }
          ctxPronto = true;
          atualizarBotaoCompletas();
          atualizarBotaoPreliminares();
        };
      </script>
