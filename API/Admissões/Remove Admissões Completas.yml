info:
  name: Remove Admissões Completas
  type: http
  seq: 4
  tags:
    - Funcionário

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/funcionario/completa"
  body:
    type: json
    data: |-
      {
        "empresa_id": "",
        "funcionario_contribuinte_id": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // =============================================================
        // PRE-REQUEST SCRIPT - BRUNO (exclusão / DELETE)
        // O body do DELETE é simples (empresa_id + funcionario_contribuinte_id),
        // não tem grupos aninhados para achatar. Mesmo assim seguimos o
        // padrão: se o funcionario_contribuinte_id não foi digitado
        // manualmente, puxa da variável salva pelo POST/PUT.
        // =============================================================

        const bodyAtual = req.getBody();

        if (bodyAtual && typeof bodyAtual === 'object' && !Array.isArray(bodyAtual)) {
          const bodyFinal = { ...bodyAtual };

          if (!bodyFinal.funcionario_contribuinte_id) {
            const idSalvo = bru.getVar('funcionario_contribuinte_id');
            if (idSalvo) {
              bodyFinal.funcionario_contribuinte_id = idSalvo;
            }
          }

          // Guarda o que está sendo enviado, para exibir no painel do
          // post-response (já que o "retorno" da API vem vazio no DELETE).
          bru.setVar('bodyEnviadoDelete', JSON.stringify(bodyFinal));

          req.setBody(bodyFinal);
        }
    - type: after-response
      code: |-
        // =============================================================
        // POST-RESPONSE SCRIPT - BRUNO (exclusão / DELETE)
        // O "retorno" da API vem vazio ({}), então não há o que reagrupar.
        // O painel mostra: status do envio, qual registro foi excluído
        // (a partir do que foi enviado no pre-request) e a mensagem da API.
        // Mesmo design visual usado no GET/POST/PUT.
        // =============================================================

        const jsonOriginal = JSON.parse(JSON.stringify(res.getBody()));
        const body = res.getBody();

        const status = res.getStatus ? res.getStatus() : (body && body.status) || 0;
        const sucesso = !!(body && body.sucesso);
        const mensagem = (body && body.mensagem) || (sucesso ? 'Operação realizada com sucesso' : 'Falha na operação');

        let registroExcluido = null;
        try { registroExcluido = JSON.parse(bru.getVar('bodyEnviadoDelete') || 'null'); } catch (e) { registroExcluido = null; }

        // Se a exclusão deu certo, limpa o ID salvo — evita que um PUT
        // seguinte tente atualizar um funcionário que não existe mais.
        if (sucesso) {
          bru.setVar('funcionario_contribuinte_id', '');
        }

        const html = `
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <style>
            :root {
              --bg: #f5f6f8; --surface: #ffffff; --surface-alt: #fafbfc; --border: #e2e5eb;
              --text: #1f2430; --text-muted: #6b7280; --primary: #4f46e5; --primary-soft: #eef0ff;
              --green: #059669; --green-soft: #ecfdf5; --red: #dc2626; --red-soft: #fef2f2;
              --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
            }
            * { box-sizing: border-box; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; font-size: 14px; }

            .status-banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--radius); margin-bottom: 16px; font-weight: 700; box-shadow: var(--shadow); }
            .status-banner.ok { background: var(--green-soft); color: var(--green); border: 1px solid #a7f3d0; }
            .status-banner.err { background: var(--red-soft); color: var(--red); border: 1px solid #fecaca; }
            .status-code { font-family: "Fira Code", Consolas, monospace; background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 6px; font-size: 13px; }

            .group-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 12px; max-width: 420px; }
            .group-title { font-size: 11.5px; color: var(--primary); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
            .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
            .data-table tr { border-bottom: 1px solid var(--border); }
            .data-table tr:last-child { border-bottom: none; }
            .data-table td { padding: 5px 2px; vertical-align: top; }
            .prop-name { color: var(--text-muted); width: 48%; }
            .prop-value { color: var(--text); text-align: right; width: 52%; word-break: break-word; font-weight: 500; }

            .mensagem-api { font-size: 13.5px; color: var(--text-muted); margin-bottom: 16px; }

            .tabs { display: flex; gap: 6px; margin: 16px 0 14px; }
            .tab-button { background: transparent; color: var(--text-muted); border: none; padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; border-bottom: 2px solid transparent; }
            .tab-button:hover { color: var(--text); }
            .tab-button.active { color: var(--primary); border-bottom-color: var(--primary); }
            .tab-content { display: none; }
            .tab-content.active { display: block; }

            .toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
            .toolbar-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
            .toolbar-btn:hover { background: var(--surface-alt); color: var(--text); }

            pre { background: #1e1e24; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; color: #a5d6a7; font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 12.5px; line-height: 1.55; margin: 0; }
          </style>
          </head>
          <body>

            <div class="status-banner ${sucesso ? 'ok' : 'err'}">
              <span>${sucesso ? '✔ Exclusão realizada com sucesso' : '✖ Falha na exclusão'}</span>
              <span class="status-code">HTTP ${status}</span>
            </div>

            <div class="mensagem-api">${mensagem}</div>

            <div class="group-box">
              <div class="group-title">Registro Excluído</div>
              <table class="data-table">
                <tr><td class="prop-name">empresa_id</td><td class="prop-value">${registroExcluido ? registroExcluido.empresa_id : '—'}</td></tr>
                <tr><td class="prop-name">funcionario_contribuinte_id</td><td class="prop-value">${registroExcluido ? registroExcluido.funcionario_contribuinte_id : '—'}</td></tr>
              </table>
            </div>

            <div class="tabs">
              <button class="tab-button active" onclick="switchTab(event, 'raw-json')">JSON Original</button>
            </div>

            <div id="raw-json" class="tab-content active">
              <div class="toolbar"><button class="toolbar-btn" onclick="copyJson()">Copiar JSON</button></div>
              <pre id="jsonRaw"><code>${JSON.stringify(jsonOriginal, null, 2)}</code></pre>
            </div>

            <script>
              function switchTab(evt, tabId) {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                evt.currentTarget.classList.add('active');
              }
              function copyJson() {
                const text = document.getElementById('jsonRaw').innerText;
                navigator.clipboard.writeText(text).then(() => {
                  const btn = event.currentTarget;
                  const original = btn.innerText;
                  btn.innerText = 'Copiado!';
                  setTimeout(() => { btn.innerText = original; }, 1500);
                });
              }
            </script>
          </body>
          </html>
        `;

        bru.visualize('html', {
          name: 'Resultado da Exclusão',
          content: html
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

