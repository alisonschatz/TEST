http:
  method: PUT
  url: "{{baseUrl}}/api/v1/autonomo/servicos"
  body:
    type: json
    data: |-
      {
        "servico_autonomo_id": 127,
        "v_servico_autonomo_id": 1,
        "autonomo_id": 24,
        "empresa_id": 900001,
        "centro_custo_id": 1,
        "descricao": "Serviço de consultoria",
        "data_servico": "2025-06-10",
        "valor": 1500.75,
        "data_pagamento": "2025-06-12",
        "tipo_servico_autonomo_id": 4,
        "documento": "012345678912345",
        "hora": "23:59"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Sucesso
    request:
