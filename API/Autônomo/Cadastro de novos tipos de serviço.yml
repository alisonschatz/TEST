info:
  name: Cadastro de novos tipos de serviço
  type: http
  seq: 11
  tags:
    - Autônomo

http:
  method: POST
  url: "{{baseUrl}}/api/v1/autonomos/tipos-servico"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "empresa_id": 900001,
            "cbo": "9999-99",
            "descricao_cbo": "Teste CBO",
            "categoria_esocial": 101,
            "ativo": true
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Operação realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cbo": "9999-99",
                "descricao_cbo": "Teste CBO",
                "categoria_esocial": 101,
                "ativo": true
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "tipo_servico_autonomo_id": 999999,
                "cliente_id": 86237,
                "empresa_id": 900001,
                "cbo": "9999-99",
                "descricao_cbo": "Teste CBO",
                "categoria_esocial": 101,
                "ativo": true,
                "log_cadastro_data": "2025-01-01 08:00:00",
                "log_alterado_data": "2025-06-01 12:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cbo": "9999-99",
                "descricao_cbo": "Teste CBO",
                "categoria_esocial": 101,
                "ativo": true
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/autonomo/tiposervicos"
      method: POST
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "empresa_id": 900001,
                "cbo": "9999-99",
                "descricao_cbo": "Teste CBO",
                "categoria_esocial": 101,
                "ativo": true
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: Permite cadastrar múltiplos tipos de serviço simultaneamente por meio de um array de dados. Cada item deve conter o nome e demais atributos obrigatórios. Útil para configuração inicial ou ajustes em lote.
