info:
  name: Lista quadros de horário paginados
  type: http
  seq: 1
  tags:
    - Quadro de Horário

http:
  method: GET
  url: "{{baseUrl}}/api/v1/quadros-horarios?empresa_id=900002"
  params:
    - name: empresa_id
      value: "900002"
      type: query
    - name: page
      value: "1"
      type: query
      description: Página atual
      disabled: true
    - name: quadro_id
      value: "55"
      type: query
      description: Filtra pelo ID técnico (PK) do quadro de horário
      disabled: true
    - name: quadro_horario_id
      value: "10"
      type: query
      description: Filtra pelo id externo do quadro de horário (único por empresa)
      disabled: true
    - name: alterado_data
      value: 2026-01-01 00:00:00
      type: query
      description: Filtra registros com logAlteradoData >= valor (sincronização incremental)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

