info:
  name: Cadastro de novas configurações de banco de horas
  type: http
  seq: 3
  tags:
    - Banco de Horas

http:
  method: POST
  url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
  headers:
    - name: SISTEMAID
      value: "19"
  body:
    type: json
    data: |-
      {
        "dados": [
          {
            "v_configuracao_id": 123456,
            "descricao": "Configuração de banco de horas",
            "observacao": "Observações adicionais"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Operação realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: POST
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas",
                "observacao": "Observações adicionais"
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas padrão",
                "observacao": "Observações gerais sobre a configuração",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: POST
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas",
                "observacao": "Observações adicionais"
              }
            ]
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: POST
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "dados": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas",
                "observacao": "Observações adicionais"
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: "Permite cadastrar múltiplas configurações de banco de horas simultaneamente por meio de um array de dados. Cada item deve conter v_configuracao_id e descricao obrigatórios. O sistema_id é obtido a partir do parâmetro SISTEMAID passado via header. ATENÇÃO: É importante que o parâmetro seja sempre passado para garantir a correta associação da configuração ao sistema desejado."
