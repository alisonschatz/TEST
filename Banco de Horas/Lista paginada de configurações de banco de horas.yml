info:
  name: Lista paginada de configurações de banco de horas
  type: http
  seq: 1
  tags:
    - Banco de Horas

http:
  method: GET
  url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
  headers:
    - name: SISTEMAID
      value: "19"
      description: ID do sistema (19=VISUAL, 52=UNICO). Se não informado, usa o valor padrão 19.
  params:
    - name: page
      value: "1"
      type: query
      description: Página atual
    - name: alterado_data
      value: 2024-01-01 00:00:00
      type: query
      description: Filtra registros alterados a partir desta data (sincronização incremental)
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Resposta com lista paginada de configurações
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: GET
      headers:
        - name: SISTEMAID
          value: "19"
          description: ID do sistema (19=VISUAL, 52=UNICO). Se não informado, usa o valor padrão 19.
      params:
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "paginacao": {
              "registros_por_pagina": 15,
              "total": 1000,
              "pagina_atual": 1,
              "ultima_pagina": 100,
              "inicio": 1,
              "fim": 15
            },
            "retorno": [
              {
                "v_configuracao_id": 123456,
                "descricao": "Configuração de banco de horas padrão",
                "observacao": "Observações gerais sobre a configuração",
                "log_cadastro_data": "2024-01-01 00:00:00",
                "log_alterado_data": "2024-06-01 00:00:00"
              }
            ]
          }
  - name: 401 Response
    description: Erro autenticação
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: GET
      headers:
        - name: SISTEMAID
          value: "19"
          description: ID do sistema (19=VISUAL, 52=UNICO). Se não informado, usa o valor padrão 19.
      params:
        - name: page
          value: "1"
          type: query
          description: Página atual
        - name: alterado_data
          value: 2024-01-01 00:00:00
          type: query
          description: Filtra registros alterados a partir desta data (sincronização incremental)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Retorna uma lista paginada de configurações de banco de horas do cliente. Pode ser filtrado por cliente_id e sistema_id. O sistema_id é automaticamente injetado com um valor padrão via header SISTEMAID caso não seja fornecido, ou seja, é importante que para busca dos dados corretos SEMPRE seja informado nas requisições o valor de SISTEMAID no header.
