info:
  name: Atualização de uma configuração de banco de horas
  type: http
  seq: 2
  tags:
    - Banco de Horas

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
  headers:
    - name: SISTEMAID
      value: "19"
  body:
    type: json
    data: |-
      {
        "v_configuracao_id": 123456,
        "descricao": "Configuração atualizada",
        "observacao": "Observações atualizadas"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Atualização realizada com sucesso
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: PUT
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": true,
            "status": 200,
            "mensagem": "Operação realizada com sucesso",
            "retorno": {
              "v_configuracao_id": 123456,
              "descricao": "Configuração de banco de horas padrão",
              "observacao": "Observações gerais sobre a configuração",
              "log_cadastro_data": "2024-01-01 00:00:00",
              "log_alterado_data": "2024-06-01 00:00:00"
            }
          }
  - name: 401 Response
    description: Token ausente ou inválido
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: PUT
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Registro não encontrado
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: PUT
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }
  - name: 422 Response
    description: Erro de validação
    request:
      url: "{{baseUrl}}/api/v1/bancohoras/configuracao"
      method: PUT
      headers:
        - name: SISTEMAID
          value: "19"
      body:
        type: json
        data: |-
          {
            "v_configuracao_id": 123456,
            "descricao": "Configuração atualizada",
            "observacao": "Observações atualizadas"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sucesso": false,
            "status": 422,
            "mensagem": "The dados.0.descricao field must not be greater than 40 characters.",
            "erros": {
              "dados.0.descricao": [
                "The dados.0.descricao field must not be greater than 40 characters."
              ]
            },
            "retorno": null
          }

docs: "Atualiza os dados de uma configuração específica, identificada por v_configuracao_id e SISTEMAID (passado no header da request). Suporta atualização parcial - apenas os campos enviados serão atualizados. ATENÇÃO: É importante que o parâmetro SISTEMAID seja sempre passado para garantir a correta associação da configuração ao sistema desejado."
